<!-- 색깔 매트 놀이터 · 교사 화면 (모듈 MAT, 역할 T) -->
<style>
#mat_T .chks{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
#mat_T .chk.sm{padding:6px 10px;font-size:13.5px;border-radius:9px;}
#mat_T .seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;overflow-x:auto;max-width:100%;}
#mat_T button.seg-b{background:transparent;border:0;color:var(--ink-2);padding:5px 11px;font-size:12.5px;border-radius:7px;white-space:nowrap;flex:none;box-shadow:none;}
#mat_T button.seg-b:hover{background:#fff;color:var(--ink);}
#mat_T button.seg-b.on{background:#fff;color:var(--accent-ink);box-shadow:0 1px 3px rgba(22,35,46,.12);}
#mat_T kbd{font-family:inherit;background:var(--soft);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 6px;font-size:12px;}
#mat_T .rk{font-weight:800;color:var(--ink-3);width:40px;}
#mat_T .rk.top{color:var(--accent);}
#mat_T .tbar{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;background:var(--line-2);min-width:120px;}
#mat_T .tbar i{display:block;height:100%;}
#mat_T .tbar .p{background:var(--accent);} #mat_T .tbar .s{background:var(--violet);}
#mat_T .legend{display:flex;gap:12px;font-size:12px;color:var(--ink-3);align-items:center;}
#mat_T .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;}
#mat_T .pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;}
#mat_T .pair{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;}
#mat_T .pair select{flex:1;min-width:0;}
#mat_T .pair .arrow{color:var(--ink-3);}
#mat_T .qrow td{vertical-align:top;}
#mat_T .qrow .qq{font-weight:700;}
#mat_T .qrow .qa{font-size:12.5px;color:var(--ink-2);}
#mat_T .qrow .qa b{color:#177A4E;}
#mat_T .qrow input.text{width:100%;font-size:13px;padding:4px 6px;}
#mat_T .st-대기{background:var(--sun-soft);color:#946C00;} #mat_T .st-승인{background:var(--green-soft);color:#177A4E;} #mat_T .st-버림{background:var(--soft);color:var(--ink-3);}
#mat_T .gstat{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
#mat_T .gs{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;}
#mat_T .gs b{display:block;font-size:15px;margin-bottom:4px;}
#mat_T .gs .n{font-size:24px;font-weight:800;letter-spacing:-.04em;}
#mat_T .gs .n small{font-size:12px;color:var(--ink-3);font-weight:600;margin-left:3px;}
#mat_T .gs .d{font-size:12px;color:var(--ink-2);margin-top:4px;}
#mat_T .gs .lv{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
#mat_T .lesson-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
#mat_T button.lcard{flex-direction:column;align-items:stretch;gap:6px;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:110px;}
#mat_T button.lcard:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);}
#mat_T .lcard h4{margin:0;font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px;}
#mat_T .lcard p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5;font-weight:500;}
#mat_T .chks label.chk{display:inline-flex;}
</style>

<div class="mroot hide" data-mod="MAT" data-role="T" id="mat_T">
  <div class="page" id="mat_tp_dash"><div id="mtPgDash"></div></div>
  <div class="page hide" id="mat_tp_stats"><div id="mtPgStats"></div></div>
  <div class="page hide" id="mat_tp_pairs"><div id="mtPgPairs"></div></div>
  <div class="page hide" id="mat_tp_lesson"><div id="mtPgLesson"></div></div>
  <div class="page hide" id="mat_tp_bank"><div id="mtPgBank"></div></div>
  <div class="page hide" id="mat_tp_settings"><div id="mtPgSettings"></div></div>
  <div id="mtModalRoot"></div>
</div>

<script>
/* 색깔 매트 놀이터 · 교사 — MODS.MAT.teacher */
MODS.MAT = MODS.MAT || {};
MODS.MAT.teacher = (function () {
  var B = null, BOOTP = null;
  var pages = ['dash', 'stats', 'pairs', 'lesson', 'bank', 'settings'];
  var nav = [
    { section: '색깔 매트 놀이터' },
    { id: 'dash', label: '학급 현황', icon: 'chart-bar' },
    { id: 'stats', label: '게임 통계', icon: 'chart-pie' },
    { id: 'pairs', label: '짝 배정', icon: 'users' },
    { id: 'lesson', label: '수업 모드', icon: 'device-projector' },
    { id: 'bank', label: '퀴즈 문제 은행', icon: 'bulb' },
    { id: 'settings', label: '매트 설정', icon: 'adjustments' }
  ];
  var ROOT = $('mat_T');
  var SEL = { g: 0, c: 0 }, PAIRS = null, BANK = { 상태: '대기', list: null }, LESSON = { g: 0, c: 0, sum: null, 제외: {} };
  function qa(sel, root) { return Array.prototype.slice.call((root || ROOT).querySelectorAll(sel)); }
  function P(id) { return $('mtPg' + id); }
  function 시간표시(초) { 초 = Math.round(초 || 0); var m = Math.floor(초 / 60), s = 초 % 60; if (m >= 60) return Math.floor(m / 60) + '시간 ' + (m % 60) + '분'; return m ? m + '분' + (s ? ' ' + s + '초' : '') : s + '초'; }
  function gname(id) { var g = B && findOne(B.게임이름, function (x) { return x[0] === id; }); return g ? g[1] : id; }
  function roster() { return (CTX && CTX.학생 ? CTX.학생 : []).filter(function (s) { return s.상태 === '재학'; }); }
  function classesOf(g) { var c = {}; roster().forEach(function (s) { if (Number(s.학년) === Number(g)) c[s.반] = 1; }); return Object.keys(c).map(Number).sort(function (a, b) { return a - b; }); }
  function studentsOf(g, c) { return roster().filter(function (s) { return Number(s.학년) === Number(g) && Number(s.반) === Number(c); }).sort(function (a, b) { return a.번호 - b.번호; }); }

  function init(ctx) { B = null; PAIRS = null; BANK.list = null; boot(null); }
  function reset() { B = null; BOOTP = null; PAIRS = null; BANK.list = null; LESSON = { g: 0, c: 0, sum: null, 제외: {} }; if (window.MATGAME && MATGAME.isOpen()) MATGAME.close(); }
  function boot(then) {
    if (!BOOTP) BOOTP = api('mat_t_boot', TOKEN).then(function (b) { B = b; BOOTP = null; setNavCount('MAT', 'bank', b.문제수.대기); if (window.MATGAME) MATGAME.setBank(b.문제 || []); }, function (e) { BOOTP = null; throw e; });
    BOOTP.then(function () { if (then) then(); }).catch(handleErr);
  }
  function show(p) {
    pages.forEach(function (id) { $('mat_tp_' + id).classList.toggle('hide', id !== p); });
    var fn = { dash: renderDash, stats: renderStats, pairs: renderPairs, lesson: renderLesson, bank: renderBank, settings: renderSettings }[p];
    if (!fn) return;
    if (!B) { boot(fn); return; }
    fn();
  }
  /* 학년·반 고르기 칸 (전체 허용) */
  function classPicker(id, sel, allowAll) {
    var gs = B.학급목록;
    return '<div class="field"><label>학년</label><select id="' + id + 'G">' + (allowAll ? '<option value="0"' + (!sel.g ? ' selected' : '') + '>전체</option>' : '') +
      gs.map(function (x) { return '<option value="' + x.학년 + '"' + (sel.g === x.학년 ? ' selected' : '') + '>' + x.학년 + '학년</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>반</label><select id="' + id + 'C">' + classOpts(sel.g, sel.c, allowAll) + '</select></div>';
  }
  function classOpts(g, c, allowAll) {
    var x = findOne(B.학급목록, function (k) { return k.학년 === Number(g); }), cs = x ? x.반 : [];
    return (allowAll ? '<option value="0"' + (!c ? ' selected' : '') + '>전체</option>' : '') + cs.map(function (n) { return '<option value="' + n + '"' + (Number(c) === n ? ' selected' : '') + '>' + n + '반</option>'; }).join('');
  }
  function bindPicker(id, sel, allowAll, onChange) {
    $(id + 'G').onchange = function () { sel.g = Number(this.value); var cs = classesOf(sel.g); sel.c = allowAll ? 0 : (cs[0] || 0); $(id + 'C').innerHTML = classOpts(sel.g, sel.c, allowAll); onChange(); };
    $(id + 'C').onchange = function () { sel.c = Number(this.value); onChange(); };
  }
  /* 모달 */
  function openModal(o) {
    closeModal();
    $('mtModalRoot').innerHTML = '<div class="modal" id="mtMd"><div style="max-width:' + (o.width || 640) + 'px"><div class="panel-head"><h3><i class="ti ti-' + (o.icon || 'user') + '"></i>' + o.title + '</h3><div class="spacer"></div><button class="ghost mini" data-mclose><i class="ti ti-x"></i>닫기</button></div><div class="panel-body">' + o.body + '</div>' + (o.foot !== undefined ? '<div class="savebar">' + o.foot + '</div>' : '') + '</div></div>';
    var m = $('mtMd'); m.addEventListener('mousedown', function (e) { if (e.target === m) closeModal(); });
    qa('[data-mclose]', m).forEach(function (b) { b.onclick = closeModal; });
    return m;
  }
  function closeModal() { $('mtModalRoot').innerHTML = ''; }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('mtMd')) closeModal(); });

  /* ================= 학급 현황 ================= */
  function renderDash() {
    var box = P('Dash');
    if (!B.학급목록.length) { box.innerHTML = '<div class="page-head"><h2>학급 현황</h2></div><div class="panel"><div class="panel-body"><div class="empty"><i class="ti ti-users"></i><strong>학생 명단이 비어 있습니다</strong>공통 학생 명단을 먼저 등록해 주세요.</div></div></div>'; return; }
    if (!SEL.g) { SEL.g = B.학급목록[0].학년; SEL.c = 0; }
    box.innerHTML = '<div class="page-head"><h2>학급 현황</h2><span class="sub">학생별 함께 · 연습 · 합계 시간과 점프, 최근 플레이, 배지. 학생을 누르면 판마다의 기록이 열립니다.</span></div>' +
      '<div class="bar">' + classPicker('mtD', SEL, true) + '<div class="spacer"></div><span class="legend"><span><i style="background:var(--accent)"></i>함께</span><span><i style="background:var(--violet)"></i>연습</span></span></div>' +
      '<div class="kpis" id="mtDKpis"></div>' +
      '<div class="panel"><div class="scroll-x"><table><thead><tr><th>순위</th><th>학생</th><th>함께</th><th>연습</th><th>합계</th><th style="min-width:130px">비율</th><th>점프</th><th>판수</th><th>게임</th><th>배지</th><th>최근</th></tr></thead><tbody id="mtDRows"></tbody></table></div><div class="empty hide" id="mtDEmpty"><i class="ti ti-run"></i><strong>아직 기록이 없습니다</strong></div></div>';
    bindPicker('mtD', SEL, true, loadDash);
    loadDash();
  }
  function loadDash() {
    api('mat_t_getClass', TOKEN, SEL.g, SEL.c).then(function (r) {
      var list = r.학생, tot = { 함께: 0, 연습: 0, 점프: 0, 판수: 0, 활동: 0 };
      list.forEach(function (s) { tot.함께 += s.함께; tot.연습 += s.연습; tot.점프 += s.점프; tot.판수 += s.판수; if (s.판수) tot.활동++; });
      $('mtDKpis').innerHTML = kpiTile('참여 학생', tot.활동 + ' / ' + list.length, '명', 'users', 'brand') + kpiTile('함께 시간 합', 시간표시(tot.함께), '', 'users-group', 'coral') + kpiTile('연습 시간 합', 시간표시(tot.연습), '', 'user', 'violet') + kpiTile('전체 판수', tot.판수, '판', 'run', 'sun');
      var max = Math.max(1, list.reduce(function (m, s) { return Math.max(m, s.합계); }, 0));
      $('mtDRows').innerHTML = list.map(function (s) {
        return '<tr class="row" data-sid="' + esc(s.학생ID) + '" style="cursor:pointer"><td class="rk' + (s.순위 && s.순위 <= 3 ? ' top' : '') + '">' + (s.순위 ? s.순위 : '-') + '</td>' +
          '<td class="name">' + (SEL.c ? '' : s.학년 + '-' + s.반 + ' ') + s.번호 + ' ' + esc(s.이름) + '</td><td>' + esc(시간표시(s.함께)) + '</td><td>' + esc(시간표시(s.연습)) + '</td><td><b>' + esc(시간표시(s.합계)) + '</b></td>' +
          '<td><div class="tbar"><i class="p" style="width:' + (s.함께 / max * 100).toFixed(1) + '%"></i><i class="s" style="width:' + (s.연습 / max * 100).toFixed(1) + '%"></i></div></td>' +
          '<td>' + fmt(s.점프) + '</td><td>' + s.판수 + '</td><td>' + s.게임수 + '/10</td><td>' + (s.배지수 ? '<span class="tag sun"><i class="ti ti-award"></i>' + s.배지수 + '</span>' : '-') + '</td><td class="unit">' + esc(s.최근 ? String(s.최근).slice(5, 16) : '-') + '</td></tr>';
      }).join('');
      $('mtDEmpty').classList.toggle('hide', list.length > 0);
      qa('[data-sid]').forEach(function (tr) { tr.onclick = function () { openStudent(tr.getAttribute('data-sid')); }; });
    }).catch(handleErr);
  }
  function openStudent(id) {
    var m = openModal({ title: '학생 기록', icon: 'user', width: 760, body: '<span class="unit">불러오는 중…</span>' });
    api('mat_t_getStudent', TOKEN, id).then(function (r) {
      if (!$('mtMd')) return;
      var s = r.학생, y = r.요약;
      m.querySelector('h3').innerHTML = '<i class="ti ti-user"></i>' + s.학년 + '학년 ' + s.반 + '반 ' + s.번호 + '번 ' + esc(s.이름);
      var 짝 = Object.keys(r.짝들).map(function (n) { return esc(n) + ' ' + r.짝들[n] + '회'; }).join(', ');
      m.querySelector('.panel-body').innerHTML =
        '<div class="kpis">' + kpiTile('함께', 시간표시(y.함께.시간), '', 'users', 'coral') + kpiTile('연습', 시간표시(y.연습.시간), '', 'user', 'violet') + kpiTile('총 운동 시간', 시간표시(y.총시간), '', 'clock', 'brand') + kpiTile('배지', y.배지수 + ' / ' + y.배지.length, '개', 'award', 'sun') + '</div>' +
        (짝 ? '<div class="note"><i class="ti ti-users"></i><div>함께 한 짝: ' + 짝 + '</div></div>' : '') +
        '<div class="chks" style="margin-bottom:10px">' + y.배지.filter(function (b) { return b.달성; }).map(function (b) { return '<span class="tag sun"><i class="ti ti-' + esc(b.아이콘) + '"></i>' + esc(b.이름) + '</span>'; }).join('') + '</div>' +
        '<div class="scroll-x"><table><thead><tr><th>시작</th><th>게임</th><th>난이도</th><th>구분</th><th>진행</th><th>인정</th><th>점프</th><th>단계</th><th>완주</th><th></th></tr></thead><tbody>' +
        (r.판.length ? r.판.map(function (p) {
          var short = p.인정시간 < r.최소시간 && p.완주 !== '진행 중';
          return '<tr' + (short || p.완주 === '진행 중' ? ' style="opacity:.6"' : '') + '><td class="unit">' + esc(String(p.시작).slice(5, 16)) + '</td><td><b>' + esc(gname(p.게임)) + '</b></td><td>' + esc(p.난이도) + '</td>' +
            '<td>' + (p.구분 === '함께' ? '<span class="tag coral">함께 · ' + esc(p.짝이름) + '</span>' : p.구분 === '수업' ? '<span class="tag sky">수업</span>' : '<span class="tag violet">연습</span>') + '</td>' +
            '<td>' + esc(시간표시(p.진행시간)) + '</td><td><b>' + esc(시간표시(p.인정시간)) + '</b>' + (short ? '<br><small class="unit">최소 시간 미만</small>' : '') + '</td><td>' + p.인정점프 + (p.점프 !== p.인정점프 ? ' <small class="unit">/ ' + p.점프 + '</small>' : '') + '</td>' +
            '<td>' + p.확인단계 + ' / ' + p.전체단계 + '</td><td>' + (p.완주 === '완주' ? '<span class="tag brand">완주</span>' : p.완주 === '진행 중' ? '<span class="tag">진행 중</span>' : '<span class="tag sun">중간 종료</span>') + '</td>' +
            '<td><button class="mini ghost danger" data-del="' + esc(p.id) + '" title="이 판 지우기"><i class="ti ti-trash"></i></button></td></tr>';
        }).join('') : '<tr><td colspan="10" class="unit">기록이 없습니다.</td></tr>') + '</tbody></table></div>';
      qa('[data-del]', m).forEach(function (b) { b.onclick = function () { if (!confirm('이 판 기록을 지울까요?')) return; api('mat_t_deleteRecord', TOKEN, b.getAttribute('data-del')).then(function () { toast('지웠습니다.'); openStudent(id); loadDash(); }).catch(handleErr); }; });
    }).catch(function (e) { closeModal(); handleErr(e); });
  }

  /* ================= 게임 통계 ================= */
  var SST = { g: 0, c: 0 };
  function renderStats() {
    var box = P('Stats');
    box.innerHTML = '<div class="page-head"><h2>게임 통계</h2><span class="sub">가장 많이 한 게임, 난이도 분포, 함께·연습 비율. 최소 시간 이상의 끝난 판만 셉니다.</span></div>' +
      '<div class="bar">' + classPicker('mtS', SST, true) + '</div><div class="kpis" id="mtSKpis"></div><div class="panel"><div class="panel-head"><h3><i class="ti ti-chart-pie"></i>게임별</h3></div><div class="panel-body"><div class="gstat" id="mtSGames"></div></div></div>';
    bindPicker('mtS', SST, true, loadStats);
    loadStats();
  }
  function loadStats() {
    api('mat_t_getStats', TOKEN, SST.g, SST.c).then(function (r) {
      var tot = r.구분.함께 + r.구분.연습 + r.구분.수업;
      $('mtSKpis').innerHTML = kpiTile('전체 판수', r.판수, '판', 'run', 'brand') + kpiTile('함께 · 연습 · 수업', r.구분.함께 + ' · ' + r.구분.연습 + ' · ' + r.구분.수업, '', 'users', 'coral') +
        kpiTile('완주율', tot ? Math.round((r.완주.완주 || 0) / tot * 100) : 0, '%', 'flag-check', 'violet') + kpiTile('플레이한 날', Object.keys(r.날짜).length, '일', 'calendar', 'sun');
      $('mtSGames').innerHTML = r.게임.length ? r.게임.map(function (g) {
        var lv = Object.keys(g.난이도).sort(function (a, b) { return g.난이도[b] - g.난이도[a]; });
        return '<div class="gs"><b>' + esc(g.이름) + '</b><div class="n">' + g.판수 + '<small>판</small></div><div class="d">인정 ' + esc(시간표시(g.시간)) + ' · 점프 ' + fmt(g.점프) + '회</div>' +
          '<div class="lv">' + lv.map(function (k) { return '<span class="tag">' + esc(k) + ' ' + g.난이도[k] + '</span>'; }).join('') + '</div></div>';
      }).join('') : '<div class="empty"><i class="ti ti-chart-pie"></i><strong>아직 기록이 없습니다</strong></div>';
    }).catch(handleErr);
  }

  /* ================= 짝 배정 ================= */
  var SPR = { g: 0, c: 0 };
  function renderPairs() {
    var box = P('Pairs');

        return '<tr class="qrow"><td><input type="checkbox" data-qsel="' + esc(q.id) + '"></td><td><div class="qq">' + esc(q.문제) + '</div><div class="qa">정답 <b>' + esc(q.정답) + '</b> · 오답 ' + esc(q.오답.join(', ')) + (q.해설 ? '<br><i class="ti ti-message"></i> ' + esc(q.해설) : '') + '</div></td>' +
          '<td>' + esc(q.학년군 ? q.학년군 + '학년' : '-') + '</td><td>' + esc((q.교과 || '-') + (q.영역 ? ' · ' + q.영역 : '')) + '</td><td>' + (q.출처 === '학생' ? '<span class="tag sky">학생 ' + esc(q.제안자) + '</span>' : q.출처 === 'AI' ? '<span class="tag violet">AI</span>' : '<span class="tag">교사</span>') + '</td><td class="unit">' + esc(String(q.등록).slice(5, 16)) + '</td>' +
          '<td style="white-space:nowrap"><button class="mini ghost" data-qedit="' + esc(q.id) + '"><i class="ti ti-pencil"></i></button>' + (q.상태 !== '승인' ? '<button class="mini soft" data-qok="' + esc(q.id) + '"><i class="ti ti-check"></i></button>' : '') + (q.상태 !== '버림' ? '<button class="mini ghost" data-qno="' + esc(q.id) + '"><i class="ti ti-x"></i></button>' : '') + '</td></tr>';
      }).join('');
      $('mtBEmpty').classList.toggle('hide', list.length > 0);
      qa('[data-qok]').forEach(function (b) { b.onclick = function () { api('mat_t_setQuestion', TOKEN, b.getAttribute('data-qok'), { 상태: '승인' }).then(function () { refreshCounts(function () { renderBank(); }); }).catch(handleErr); }; });
      qa('[data-qno]').forEach(function (b) { b.onclick = function () { api('mat_t_setQuestion', TOKEN, b.getAttribute('data-qno'), { 상태: '버림' }).then(function () { refreshCounts(function () { renderBank(); }); }).catch(handleErr); }; });
      qa('[data-qedit]').forEach(function (b) { b.onclick = function () { editQuestion(findOne(BANK.list, function (q) { return q.id === b.getAttribute('data-qedit'); })); }; });
    }).catch(handleErr);
  }
  function editQuestion(q) {
    if (!q) return;
    var m = openModal({ title: '문제 고치기', icon: 'pencil', body:
      '<div class="field" style="margin-bottom:8px"><label>문제</label><input type="text" id="mtQq" value="' + esc(q.문제) + '" maxlength="120"></div>' +
      '<div class="grid g2" style="margin-bottom:8px"><div class="field"><label>정답</label><input type="text" id="mtQa" value="' + esc(q.정답) + '"></div><div class="field"><label>오답 1</label><input type="text" id="mtQw1" value="' + esc(q.오답[0] || '') + '"></div></div>' +
      '<div class="grid g2" style="margin-bottom:8px"><div class="field"><label>오답 2</label><input type="text" id="mtQw2" value="' + esc(q.오답[1] || '') + '"></div><div class="field"><label>오답 3</label><input type="text" id="mtQw3" value="' + esc(q.오답[2] || '') + '"></div></div>' +
      '<div class="field" style="margin-bottom:8px"><label>해설</label><input type="text" id="mtQe" value="' + esc(q.해설) + '" maxlength="120"></div>' +
      '<div class="grid g3"><div class="field"><label>학년군</label><select id="mtQg"><option value="">구분 없음</option>' + B.학년군.map(function (g) { return '<option value="' + g + '"' + (q.학년군 === g ? ' selected' : '') + '>' + g + '학년</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>교과</label><select id="mtQs">' + B.교과.map(function (a) { return '<option' + (q.교과 === a ? ' selected' : '') + '>' + a + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>체육 영역</label><select id="mtQr"><option value="">-</option>' + B.영역.map(function (a) { return '<option' + (q.영역 === a ? ' selected' : '') + '>' + a + '</option>'; }).join('') + '</select></div></div>',
      foot: '<span class="status" id="mtQStatus"></span><div class="spacer"></div><button id="mtQSave"><i class="ti ti-device-floppy"></i>저장' + (q.상태 === '대기' ? ' + 승인' : '') + '</button>' });
    $('mtQSave').onclick = function () {
      var patch = { 문제: $('mtQq').value, 정답: $('mtQa').value, 오답: [$('mtQw1').value, $('mtQw2').value, $('mtQw3').value], 해설: $('mtQe').value, 학년군: $('mtQg').value, 교과: $('mtQs').value, 영역: $('mtQs').value === '체육' ? $('mtQr').value : '' };
      if (q.상태 === '대기') patch.상태 = '승인';
      setStatus('mtQStatus', '저장 중…');
      api('mat_t_setQuestion', TOKEN, q.id, patch).then(function () { closeModal(); toast('저장했습니다.'); refreshCounts(function () { renderBank(); }); }).catch(function (e) { setStatus('mtQStatus', (e && e.message) || String(e), 'err'); });
    };
  }

  /* ================= 설정 ================= */
  function renderSettings() {
    var s = B.설정, box = P('Settings'), games = window.MATGAME ? MATGAME.list() : (B.게임이름 || []).map(function (g) { return { id: g[0], name: g[1] }; });
    box.innerHTML = '<div class="page-head"><h2>매트 설정</h2><span class="sub">짝 정하는 방식, 누적 기준, 학생에게 보여 줄 게임, 배지 기준.</span></div>' +
      '<div class="panel"><div class="panel-head"><h3><i class="ti ti-users"></i>짝 · 누적 기준</h3></div><div class="panel-body">' +
        '<div class="grid g3" style="margin-bottom:12px">' +
          '<div class="field"><label>짝 정하는 방식</label><select id="mtSPair"><option value="학생"' + (s.짝방식 === '학생' ? ' selected' : '') + '>학생이 고름</option><option value="교사"' + (s.짝방식 === '교사' ? ' selected' : '') + '>교사가 배정 (짝 배정 화면)</option></select></div>' +
          '<div class="field"><label>누적에 넣을 최소 시간 (초)</label><input type="number" id="mtSMin" min="0" max="600" value="' + s.최소시간 + '"></div>' +
          '<div class="field"><label>짝 확인 버튼이 떠 있는 시간 (초)</label><input type="number" id="mtSSec" min="2" max="30" value="' + s.확인시간 + '"></div></div>' +
        '<div class="grid g3" style="margin-bottom:12px">' +
          '<div class="field"><label>대상 학년 (비우면 전 학년)</label><input type="text" id="mtSGr" value="' + esc(s.대상학년.join(',')) + '" placeholder="예: 3,4,5,6"></div>' +
          '<div class="field"><label>시간 배지 기준 (분, 쉼표)</label><input type="text" id="mtSBt" value="' + esc(s.배지시간.join(',')) + '"></div>' +
          '<div class="field"><label>점프 배지 기준 (회, 쉼표)</label><input type="text" id="mtSBj" value="' + esc(s.배지점프.join(',')) + '"></div></div>' +
        '<div class="chks" style="margin-bottom:6px"><label class="chk sm' + (s.학생제안 ? ' on' : '') + '"><input type="checkbox" id="mtSProp"' + (s.학생제안 ? ' checked' : '') + '><span>학생도 퀴즈 문제를 낼 수 있게 (교사 승인 후 문제 은행에)</span></label>' +
        '<label class="chk sm' + (s.해설표시 ? ' on' : '') + '"><input type="checkbox" id="mtSExp"' + (s.해설표시 ? ' checked' : '') + '><span>퀴즈 정답을 보여 줄 때 한 줄 해설도 (정답 시간 2.8초 → 4.6초)</span></label></div>' +
      '</div></div>' +
      '<div class="panel"><div class="panel-head"><h3><i class="ti ti-layout-grid"></i>학생에게 보여 줄 게임</h3></div><div class="panel-body"><div class="chks">' +
        games.map(function (g) { var on = s.게임.indexOf(g.id) >= 0; return '<label class="chk sm' + (on ? ' on' : '') + '"><input type="checkbox" data-sgame="' + g.id + '"' + (on ? ' checked' : '') + '><span>' + esc(g.name) + '</span></label>'; }).join('') + '</div></div>' +
        '<div class="savebar"><span class="status" id="mtSStatus"></span><div class="spacer"></div><button id="mtSSave"><i class="ti ti-device-floppy"></i>저장</button></div></div>' +
      '<div class="panel"><div class="panel-body"><div class="note"><i class="ti ti-info-circle"></i><div>기록은 <b>MAT_기록</b>, 교사 배정 짝은 <b>MAT_짝</b>, 퀴즈 문제는 <b>MAT_문제</b> 시트에 저장됩니다. 배지는 누적에서 계산합니다. 지우려면 공통 <b>초기화</b> 화면에서 색깔 매트 놀이터 항목을 고르세요.</div></div></div></div>';
    $('mtSSave').onclick = function () {
      var map = { 짝방식: $('mtSPair').value, 최소시간: $('mtSMin').value, 확인시간: $('mtSSec').value, 대상학년: $('mtSGr').value, 배지시간: $('mtSBt').value, 배지점프: $('mtSBj').value,
                  학생제안: $('mtSProp').checked, 해설표시: $('mtSExp').checked, 게임: qa('[data-sgame]:checked').map(function (c) { return c.getAttribute('data-sgame'); }) };
      if (!map.게임.length) { setStatus('mtSStatus', '게임은 하나 이상 켜 두세요.', 'err'); return; }
      setStatus('mtSStatus', '저장 중…');
      api('mat_t_saveSettings', TOKEN, map).then(function (r) { B.설정 = r.설정; setStatus('mtSStatus', '저장했습니다.', 'ok'); toast('저장했습니다.'); }).catch(function (e) { setStatus('mtSStatus', (e && e.message) || String(e), 'err'); });
    };
  }

  return { nav: nav, init: init, show: show, reset: reset };
})();
</script>
