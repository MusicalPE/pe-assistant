<!-- 색깔 매트 놀이터 · 게임 엔진 (모듈 MAT, 학생·교사 공용). 단독판 "색깔 매트 놀이터"의 게임 코드를 오버레이(#matOverlay) 안에서 돌게 옮긴 것입니다.
     앱 쪽 연결: MATGAME.open(게임id, { extraHTML, onOpen, validate, onStart, onUnit, onEnd, onExit, onAgain, peer, peerName, peerSec, noSkip, hideOptions, confirmExit })
                MATGAME.setBank(문제들) · MATGAME.setPics(그림들) · MATGAME.setPeer(on, 이름) · MATGAME.doneHTML(html) · MATGAME.list() · MATGAME.glyph(id)
     기록 훅: 게임이 지시를 하나 낼 때마다 api.jump(), 단계·라운드가 끝날 때 api.unit() → 짝 확인 버튼 → onUnit(단계, 요약) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
#matOverlay{
    color-scheme: dark;
    --ground:#000000;
    --panel:#14161C;
    --panel2:#1B1E26;
    --line:#2C3140;
    --ink:#F2F3F7;
    --muted:#9097A8;
    --yellow:#FFD21F;
    --green:#2FC653;
    --blue:#4C88FF;
    --red:#F2392F;
    --display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --ui:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }
#matOverlay [hidden]{display:none!important}
#matOverlay{height:100%}
#matOverlay{position:fixed;inset:0;z-index:9000;background:var(--ground);color:var(--ink);font-family:var(--ui);overflow:hidden;margin:0;font-size:16px;line-height:1.4;
    padding-inline:16px;box-sizing:border-box;-webkit-user-select:none;user-select:none}
#matOverlay button,#matOverlay textarea{font-family:inherit}
#matOverlay button:focus-visible,#matOverlay input:focus-visible+span,#matOverlay textarea:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#matOverlay .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
#matOverlay /* 공통 매트 (왼위 빨강 · 오위 노랑 · 왼아래 초록 · 오아래 파랑) */
  .mat4{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:1;max-width:100%;border:.8vh solid var(--line);
    background:var(--line);gap:.5vh;flex:none;box-sizing:border-box}
#matOverlay .mat4 i{background:var(--c);display:flex;align-items:center;justify-content:center;transition:opacity .1s;font-style:normal;position:relative}
#matOverlay .mat4 i.off{opacity:.14}
#matOverlay .mat4 i.now{opacity:.5;outline:.5vh dashed #fff;outline-offset:-1.2vh}
#matOverlay .mat4 i.on{opacity:1;box-shadow:inset 0 0 0 .7vh #fff}
#matOverlay .mat4 b{font-family:var(--ui);font-weight:700;font-size:min(3.4vh,3vw);background:#fff;color:#111;
    padding:.25em .7em;border-radius:99px;white-space:nowrap}
#matOverlay .glyph{width:44px;border-width:3px;gap:2px}
#matOverlay .glyph i.off{opacity:.2}
#matOverlay /* ---------- 게임 목록 ---------- */
  #mgHub{overflow-y:auto;gap:28px;padding-block:32px}
#matOverlay .hub-head{display:flex;align-items:center;gap:clamp(16px,3vw,32px);flex-wrap:wrap;justify-content:center;text-align:left}
#matOverlay .hub-head .mat4{width:clamp(76px,10vw,120px);transform:rotate(-8deg);border-width:5px;gap:0}
#matOverlay h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,7vw,88px);line-height:1;margin:0}
#matOverlay h1 .c1{color:var(--red)}
#matOverlay h1 .c2{color:var(--yellow)}
#matOverlay h1 .c3{color:var(--green)}
#matOverlay h1 .c4{color:var(--blue)}
#matOverlay .sub{margin:.5em 0 0;color:var(--muted);font-size:clamp(14px,1.5vw,18px);max-width:60ch}
#matOverlay .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;width:min(1100px,100%)}
#matOverlay .card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:18px 18px 16px;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
#matOverlay .card:hover{border-color:#566079;background:var(--panel2)}
#matOverlay .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
#matOverlay .card h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.1}
#matOverlay .card p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.55}
#matOverlay .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
#matOverlay .meta span{font-size:12.5px;font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
#matOverlay .hub-foot{color:var(--muted);font-size:13px;text-align:center;line-height:1.7}
#matOverlay kbd{font-family:var(--ui);background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 6px;font-size:12px;color:var(--ink)}
#matOverlay /* ---------- 게임 설정 ---------- */
  #mgSetup{overflow-y:auto;gap:22px;padding-block:28px}
#matOverlay .setup-wrap{width:min(900px,100%);display:flex;flex-direction:column;gap:22px}
#matOverlay .back{align-self:flex-start;background:none;border:0;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;padding:4px 0}
#matOverlay .back:hover{color:var(--ink)}
#matOverlay .setup-head h2{font-family:var(--display);font-weight:400;font-size:clamp(36px,5.5vw,64px);margin:0;line-height:1}
#matOverlay .setup-head p{color:var(--muted);margin:.6em 0 0;font-size:16px;line-height:1.6;max-width:65ch}
#matOverlay .how{margin:0;padding:0;list-style:none;display:grid;gap:8px}
#matOverlay .how li{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:15px;line-height:1.5}
#matOverlay .options{display:flex;gap:14px;flex-wrap:wrap}
#matOverlay fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:0;background:var(--panel);min-width:0;flex:1 1 auto}
#matOverlay legend{padding:0 6px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.04em}
#matOverlay .seg{display:flex;gap:6px;flex-wrap:wrap}
#matOverlay .seg label{cursor:pointer}
#matOverlay .seg input{position:absolute;opacity:0;pointer-events:none}
#matOverlay .seg span{display:block;padding:9px 14px;border-radius:7px;border:1px solid var(--line);font-weight:600;font-size:15px;color:var(--muted)}
#matOverlay .seg input:checked+span{background:var(--ink);color:var(--ground);border-color:var(--ink)}
#matOverlay textarea{width:100%;box-sizing:border-box;min-height:150px;background:var(--ground);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.6;resize:vertical;-webkit-user-select:text;user-select:text}
#matOverlay .fhelp{color:var(--muted);font-size:13px;margin:8px 0 0;line-height:1.6}
#matOverlay .start{font-family:var(--display);font-size:clamp(26px,3.4vw,40px);font-weight:400;background:var(--yellow);color:#15130a;
    border:0;border-radius:14px;padding:.38em 1.6em .42em;cursor:pointer;box-shadow:0 6px 0 #b8940c;transition:transform .08s;align-self:center}
#matOverlay .start:active{transform:translateY(4px);box-shadow:0 2px 0 #b8940c}
#matOverlay .tracks{display:grid;gap:6px;margin-bottom:10px}
#matOverlay .track{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ground);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:14.5px}
#matOverlay .track span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#matOverlay .track button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;flex:none}
#matOverlay .addbtn{display:inline-block;background:var(--ink);color:var(--ground);font-weight:700;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:15px}
#matOverlay .addbtn:focus-within{outline:3px solid var(--ink);outline-offset:3px}
#matOverlay .err{color:#ff8a80;font-weight:600;text-align:center;margin:0}
#matOverlay /* ---------- 재생 화면 ---------- */
  #mgPlay{justify-content:space-between}
#matOverlay .hud{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
#matOverlay .hud-l{font-family:var(--display);font-size:clamp(24px,3.4vw,46px);line-height:1;white-space:nowrap}
#matOverlay .hud-l small{font-family:var(--ui);font-size:.42em;color:var(--muted);font-weight:600;margin-left:.4em;vertical-align:.3em}
#matOverlay .chip{font-weight:700;font-size:clamp(13px,1.7vw,21px);padding:.35em .9em;border-radius:99px;border:2px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#matOverlay .hud-r{font-family:var(--display);font-size:clamp(24px,3.4vw,46px);font-variant-numeric:tabular-nums;color:var(--muted);line-height:1;white-space:nowrap}
#matOverlay .stage{flex:1;width:100%;position:relative;min-height:0;margin-block:1.5vh}
#matOverlay #mgBody{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#matOverlay .stage.bannering #mgBody{visibility:hidden}
#matOverlay #mgBanner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25em;text-align:center}
#matOverlay #mgBanner .big{font-family:var(--display);font-size:min(20vw,36vh);line-height:1}
#matOverlay #mgBanner .note{font-weight:700;font-size:clamp(18px,2.8vw,38px);color:var(--muted)}
#matOverlay #mgBanner.go .big{animation:zoom .5s ease-out}
@keyframes zoom{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
#matOverlay #mgPaused{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.84);
    font-family:var(--display);font-size:clamp(40px,8vw,100px);z-index:5}
#matOverlay .bar{width:100%;display:grid;gap:5px;flex:none}
#matOverlay .bar div{height:clamp(10px,1.6vh,16px);border-radius:3px;background:var(--panel2);overflow:hidden;position:relative}
#matOverlay .bar div i{position:absolute;inset:0;width:0;background:var(--ink)}
#matOverlay .ctrls{position:absolute;right:16px;bottom:calc(clamp(10px,1.6vh,16px) + 28px);display:flex;gap:6px;opacity:0;transition:opacity .3s;z-index:6;flex-wrap:wrap;justify-content:flex-end}
#matOverlay.show-ctrls .ctrls,#matOverlay .ctrls:focus-within{opacity:1}
#matOverlay .ctrls button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer}
#matOverlay .pop{animation:pop .22s cubic-bezier(.2,.9,.3,1.3)}
#matOverlay /* 유튜브 작은 플레이어 (왼쪽 아래) */
  .ytbox{position:absolute;left:16px;bottom:calc(clamp(10px,1.6vh,16px) + 28px);z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px}
#matOverlay .ytbox .frame{width:132px;height:74px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000;opacity:.9}
#matOverlay .ytbox .frame iframe{display:block;width:100%;height:100%;border:0}
#matOverlay .ythint{background:var(--yellow);color:#15130a;font-weight:800;font-size:13px;border-radius:99px;padding:5px 10px;animation:pop .3s;text-align:center;max-width:200px;line-height:1.4}
@keyframes pop{from{transform:scale(.72);opacity:.2}to{transform:scale(1);opacity:1}}
#matOverlay /* 스트룹 */
  .s-stroop{flex-direction:column;gap:3.5vh}
#matOverlay .s-stroop .word{font-family:var(--display);line-height:1;white-space:nowrap;letter-spacing:.04em;
    -webkit-text-stroke:0.015em currentColor;paint-order:stroke fill;
    font-size:calc(min(27vw,62vh) * var(--scale,1));transition:font-size .6s ease}
#matOverlay .s-stroop .word.double{display:flex;gap:7vw;align-items:flex-end;font-size:calc(min(13.5vw,48vh) * var(--scale,1))}
#matOverlay .s-stroop.easy .word{font-size:calc(min(19vw,34vh) * var(--scale,1))}
#matOverlay .s-stroop.easy .word.double{font-size:calc(min(10vw,28vh) * var(--scale,1))}
#matOverlay .w{display:flex;flex-direction:column;align-items:center;gap:.12em}
#matOverlay .w small{font-family:var(--ui);font-weight:700;font-size:clamp(16px,2.2vw,30px);letter-spacing:.05em;color:var(--muted);-webkit-text-stroke:0}
#matOverlay .hintmat{width:min(38vh,36vw)}
#matOverlay /* 기억력 */
  .s-memory{flex-direction:column;gap:2.4vh}
#matOverlay .cap{font-family:var(--display);font-size:clamp(28px,5.5vh,64px);line-height:1}
#matOverlay .s-memory .mat4{width:min(54vh,70vw)}
#matOverlay .slots{display:flex;gap:1.2vh;flex-wrap:wrap;justify-content:center}
#matOverlay .slots span{width:min(6vh,7vw);aspect-ratio:1;border-radius:50%;border:.4vh solid var(--line);display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:min(3vh,3.4vw);color:var(--muted)}
#matOverlay .slots span.done{background:var(--ink);color:#000;border-color:var(--ink)}
#matOverlay /* 리듬 */
  .s-rhythm canvas{position:absolute;inset:0;width:100%;height:100%}
#matOverlay /* 방향 */
  .s-dir{gap:5vw}
#matOverlay .s-dir .arrowbox{display:flex;flex-direction:column;align-items:center;gap:1.5vh}
#matOverlay .s-dir svg{width:min(52vh,46vw);height:min(52vh,46vw);display:block}
#matOverlay .s-dir .trick{font-family:var(--display);font-size:clamp(28px,6vh,72px);line-height:1;color:#000;background:var(--ink);padding:.1em .5em;border-radius:.2em}
#matOverlay .s-dir .stay{font-family:var(--display);font-size:min(22vh,18vw);line-height:1}
#matOverlay .s-dir .mat4{width:min(40vh,34vw)}
#matOverlay /* 퀴즈 */
  .s-quiz{flex-direction:column;gap:2.6vh}
#matOverlay .qtext{font-family:var(--display);font-size:clamp(30px,min(8vh,6.5vw),96px);line-height:1.15;text-align:center;max-width:92vw;text-wrap:balance}
#matOverlay .qtimer{width:min(64vh,80vw);height:1.2vh;background:var(--panel2);border-radius:99px;overflow:hidden}
#matOverlay .qtimer i{display:block;height:100%;background:var(--ink);width:100%}
#matOverlay .s-quiz .mat4{width:min(52vh,78vw)}
#matOverlay .s-quiz .mat4 i{padding:4%;box-sizing:border-box}
#matOverlay .s-quiz .mat4 em{font-style:normal;font-family:var(--display);text-align:center;line-height:1.1;color:var(--t);word-break:keep-all;text-wrap:balance}
#matOverlay .qrow{display:flex;align-items:center;gap:2vh}
#matOverlay .qsec{font-family:var(--display);font-size:min(6vh,6vw);color:var(--ink);line-height:1;width:1.2em;text-align:center;font-variant-numeric:tabular-nums}
#matOverlay .qans{font-weight:700;font-size:clamp(18px,3.4vh,36px);color:var(--muted);min-height:1.3em}
#matOverlay /* 연상 */
  .s-assoc{flex-direction:column;gap:3vh}
#matOverlay .pics{display:flex;gap:8vw;align-items:flex-end}
#matOverlay .pic{display:flex;flex-direction:column;align-items:center;gap:.4vh}
#matOverlay .pic .e{font-family:var(--emoji);line-height:1.05;font-size:calc(min(40vh,34vw) * var(--scale,1))}
#matOverlay .pics.two .pic .e{font-size:calc(min(30vh,24vw) * var(--scale,1))}
#matOverlay .s-assoc.easy .pic .e{font-size:calc(min(26vh,24vw) * var(--scale,1))}
#matOverlay .s-assoc.easy .pics.two .pic .e{font-size:calc(min(20vh,18vw) * var(--scale,1))}
#matOverlay .pic .n{font-family:var(--display);font-size:clamp(26px,5.4vh,64px);line-height:1}
#matOverlay .pic .n .two-feet{display:inline-block;font-family:var(--ui);font-size:.42em;font-weight:800;background:var(--yellow);color:#15130a;border-radius:99px;padding:.15em .6em;vertical-align:middle;margin-left:.3em}
#matOverlay /* 트위스터 */
  .s-twist{gap:5vw}
#matOverlay .tw-l{display:flex;flex-direction:column;align-items:flex-start;gap:2vh}
#matOverlay .tw-limb{font-family:var(--display);font-size:min(17vh,13vw);line-height:1}
#matOverlay .tw-to{font-family:var(--display);font-size:min(13vh,10vw);line-height:1}
#matOverlay .tw-hold{display:flex;align-items:center;gap:1.4vw;color:var(--muted);font-weight:700;font-size:clamp(18px,3.4vh,36px)}
#matOverlay .tw-hold b{font-family:var(--display);font-weight:400;font-size:min(12vh,9vw);color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
#matOverlay .s-twist .mat4{width:min(56vh,42vw)}
#matOverlay /* 색깔 점프 (기본) */
  .bs-wrap{position:absolute;inset:0;display:flex;z-index:0}
#matOverlay .bs-half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:#000}
#matOverlay .s-basic.two .bs-half+.bs-half{border-left:1.2vh solid #000}
#matOverlay .bs-half b{font-family:var(--display);font-weight:400;line-height:1;font-size:min(24vw,40vh)}
#matOverlay .s-basic.two .bs-half b{font-size:min(13vw,30vh)}
#matOverlay .bs-half small{font-family:var(--display);font-size:clamp(28px,6vh,72px);line-height:1;opacity:.85}
#matOverlay .bs-mini{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:min(16vh,16vw);aspect-ratio:1;padding:6px;background:rgba(0,0,0,.55);border-radius:8px}
#matOverlay .bs-mini i{background:rgba(255,255,255,.18);border-radius:3px}
#matOverlay .bs-mini i.on{background:#fff}
#matOverlay .bs-half.flash{animation:bsin .14s ease-out}
@keyframes bsin{from{filter:brightness(.1)}to{filter:none}}
#matOverlay #mgPlay.fullbleed .hud,#matOverlay #mgPlay.fullbleed .bar{position:relative;z-index:2}
#matOverlay #mgPlay.fullbleed .hud-l,#matOverlay #mgPlay.fullbleed .hud-r,#matOverlay #mgPlay.fullbleed .chip{background:rgba(0,0,0,.62);border-radius:12px;padding:.18em .45em;color:var(--ink)}
#matOverlay #mgPlay.fullbleed .chip{border-radius:99px;padding:.35em .9em}
#matOverlay #mgPlay.fullbleed #mgBanner{z-index:3}
#matOverlay .card.feat{grid-column:1/-1;flex-direction:row;align-items:center;gap:22px;position:relative;padding:22px 24px}
#matOverlay .card.feat .card-top{flex-direction:row-reverse;justify-content:flex-end;gap:18px}
#matOverlay .card.feat .glyph{width:72px;border-width:4px}
#matOverlay .card.feat h3{font-size:34px}
#matOverlay .card.feat p{max-width:60ch}
#matOverlay .card.feat .meta{margin-top:0;margin-left:auto;flex:none}
#matOverlay .feat-tag{position:absolute;top:-11px;left:20px;background:var(--yellow);color:#15130a;font-weight:700;font-size:12.5px;border-radius:99px;padding:3px 10px}
@media (max-width:760px){#matOverlay .card.feat{flex-direction:column;align-items:flex-start}
#matOverlay .card.feat .meta{margin-left:0}}
#matOverlay /* 용암 매트 */
  .s-lava{flex-direction:column;gap:2.2vh}
#matOverlay .lv-title{font-family:var(--display);font-size:clamp(30px,7.5vh,90px);line-height:1;white-space:nowrap}
#matOverlay .s-lava.nomap .lv-title{font-size:clamp(44px,15vh,170px)}
#matOverlay .s-pics{flex-direction:column;gap:1.4vh;justify-content:center}
#matOverlay .pcwrap{display:flex;flex-direction:column;align-items:center;gap:.8vh;max-width:92vw}
#matOverlay .pcimg{height:min(36vh,60vw);max-width:92vw;object-fit:contain;border-radius:2vh;background:var(--panel);display:block;transition:height .25s}
#matOverlay .s-pics.reveal .pcimg{height:min(22vh,40vw)}
#matOverlay .pcname{font-family:var(--display);font-size:clamp(24px,4.6vh,56px);line-height:1;min-height:1em}
#matOverlay .s-pics .qrow{min-height:2.4vh}
#matOverlay .s-pics .mat4{width:min(24vh,50vw);transition:width .25s}
#matOverlay .s-pics.reveal .mat4{width:min(34vh,60vw)}
#matOverlay .s-pics .qans{text-align:center;max-width:92vw}
#matOverlay .s-pics.reveal .qans{color:var(--ink);font-size:clamp(22px,4.2vh,48px)}

<script>
try {

(() => {
  // ================= 공통 =================
  const COLORS = [
    {name:'노란색', short:'노랑', css:'var(--yellow)', hex:'#FFD21F', text:'#1a1500'},
    {name:'초록색', short:'초록', css:'var(--green)',  hex:'#2FC653', text:'#ffffff'},
    {name:'파란색', short:'파랑', css:'var(--blue)',   hex:'#4C88FF', text:'#ffffff'},
    {name:'빨간색', short:'빨강', css:'var(--red)',    hex:'#F2392F', text:'#ffffff'},
  ];
  const MAT = [3,0,1,2];            // 칸 순서: 왼위 빨강, 오위 노랑, 왼아래 초록, 오아래 파랑
  const POS = []; MAT.forEach((c,p)=>POS[c]=p);
  const OV = document.getElementById('matOverlay');
  const $ = id => document.getElementById(id);
  const H = { hooks: {}, bank: [], pics: [] };   // 앱이 꽂는 훅과 문제 은행·우리 반 그림
  const rnd = n => Math.floor(Math.random()*n);
  const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
  const fmt = s => { s=Math.max(0,Math.ceil(s)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
  const esc = s => String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

  function makeMat(cls){
    const el=document.createElement('div'); el.className='mat4 '+(cls||'');
    el.innerHTML=MAT.map(c=>`<i data-c="${c}" style="--c:${COLORS[c].css}"><b hidden></b></i>`).join('');
    const cells=[...el.children];
    return { el, cells,
      // items: null → 모두 보통 / [{c, label, style:'on'|'now'}] → 나머지는 흐리게
      show(items){
        cells.forEach(cell=>{
          const c=+cell.dataset.c, list=items?items.filter(x=>x.c===c):[];
          const st = !items ? '' : list.some(x=>x.style!=='now') ? 'on' : list.length ? 'now' : 'off';
          cell.className=st;
          const b=cell.querySelector('b'), lab=list.map(x=>x.label).filter(Boolean).join(' · ');
          b.textContent=lab; b.hidden=!lab;
        });
      }
    };
  }

  // ================= 소리 =================
  let ac=null, out=null, bus=null, curDest=null, noiseBuf=null, soundOn=true, musicOn=true;
  const dst=()=>curDest||out;
  function initAudio(){
    if(ac){ ac.resume(); return; }
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    out=ac.createGain(); out.gain.value=0.8; out.connect(comp).connect(ac.destination);
    bus=ac.createGain(); bus.gain.value=1; bus.connect(out); // 음악 전용 통로 — 얼음 스텝에서 음악만 뚝 끊을 때 사용
    noiseBuf=ac.createBuffer(1, ac.sampleRate*0.5, ac.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function tone(freq,t,dur,vol,type='sine',lp){
    const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    let node=o.connect(g);
    if(lp){ const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; node=g.connect(f); }
    node.connect(dst()); o.start(t); o.stop(t+dur+0.03);
  }
  const fxBoost=()=>E.useYT||E.useMine?1.8:1;   // 유튜브·내 음악 파일이 나올 때는 효과음이 묻히지 않게 키움
  function beep(freq,dur=0.09,vol=0.18,type='sine'){ if(soundOn&&ac&&ac.state==='running') tone(freq,ac.currentTime,dur,Math.min(0.5,vol*fxBoost()),type); }
  const chime=()=>{ yt.duck(900); [660,880,1175].forEach((f,i)=>setTimeout(()=>beep(f,0.16,0.2,'triangle'),i*110)); };
  const tick=()=>beep(musicOn&&E.game&&E.game.bpmAt?1320:880,0.06,0.13,'triangle');
  const COLOR_NOTE=[76,79,84,72]; // 노랑 E5, 초록 G5, 파랑 C6, 빨강 C5
  const colorTone=c=>beep(mtof(COLOR_NOTE[c]),0.35,0.22,'triangle');

  function kick(t){ const o=ac.createOscillator(), g=ac.createGain();
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
    g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.28);
    o.connect(g).connect(dst()); o.start(t); o.stop(t+0.3); }
  function noise(t,dur,vol,type,freq){ const s=ac.createBufferSource(); s.buffer=noiseBuf;
    const f=ac.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=ac.createGain();
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(f).connect(g).connect(dst()); s.start(t); s.stop(t+dur+0.02); }
  const clap=t=>{ noise(t,0.14,0.45,'bandpass',1700); noise(t+0.012,0.1,0.3,'bandpass',2200); };
  const hat=(t,v=0.12)=>noise(t,0.035,v,'highpass',7500);
  const ohat=t=>noise(t,0.18,0.1,'highpass',6500);

  // 직접 만든 밝은 C장조 4마디 루프 (C - G - Am - F)
  const BASS=[36,43,45,41];
  const CHORD=[[60,64,67,72],[59,62,67,71],[57,60,64,69],[57,60,65,69]];
  const _=0;
  const MEL=[
    [72,_,76,_,79,_,76,_,74,_,76,_,72,_,_,_],
    [71,_,74,_,79,_,74,_,71,_,74,_,67,_,_,_],
    [69,_,72,_,76,_,72,_,74,_,72,_,69,_,_,_],
    [65,_,69,_,72,_,77,_,76,_,74,_,72,_,71,_],
  ];
  const snare=(t,v=0.4)=>{ noise(t,0.16,v,'bandpass',1300); tone(190,t,0.08,v*0.5,'triangle'); };
  // 직접 만든 기본 음악 4종 (저작권 걱정 없음)
  const STYLES={
    march:{ name:'행진곡',
      step(bar,s,t,L,b16){
        const ROOT=[41,46,48,41], TRI=[[65,69,72],[62,65,70],[64,67,70],[65,69,72]];
        const M=[[72,_,_,72,77,_,76,_,74,_,72,_,69,_,_,_],[70,_,_,70,74,_,72,_,70,_,69,_,70,_,_,_],
                 [67,_,_,67,72,_,70,_,67,_,64,_,67,_,_,_],[69,_,72,_,77,_,76,_,77,_,_,_,72,_,_,_]];
        if(s%8===0){ kick(t); tone(mtof(ROOT[bar]),t,b16*3,0.34,'triangle',600); }
        if(s%8===4){ snare(t,0.32); tone(mtof(ROOT[bar]+7),t,b16*3,0.28,'triangle',600); }
        if(L>=3 && (s===14||s===15) && bar===3) snare(t,0.22);
        if(L>=4 && s%8===4) TRI[bar].forEach(n=>tone(mtof(n),t,b16*1.5,0.035,'square',1800));
        if(L>=6 && s===0 && bar===0) ohat(t);
        if(L>=1 && M[bar][s]) tone(mtof(M[bar][s]),t,b16*2.2,0.075,'square',2200);
      }},
    kids:{ name:'동요풍',
      step(bar,s,t,L,b16){
        const ROOT=[43,48,50,43], CH=[[67,71,74,79],[64,67,72,76],[62,66,69,74],[67,71,74,79]];
        const M=[[67,_,71,_,74,_,71,_,72,_,71,_,69,_,_,_],[72,_,76,_,72,_,67,_,69,_,71,_,72,_,_,_],
                 [74,_,72,_,71,_,69,_,66,_,69,_,74,_,_,_],[71,_,69,_,67,_,71,_,67,_,_,_,67,_,_,_]];
        if(s%8===0) kick(t);
        if(L>=1 && s%8===4) clap(t);
        if(s%2===0) hat(t,0.05);
        if(s%4===0) tone(mtof(ROOT[bar]),t,b16*2.5,0.3,'triangle',500);
        if(M[bar][s]) { tone(mtof(M[bar][s]+12),t,b16*2.4,0.11,'triangle'); tone(mtof(M[bar][s]+24),t,b16*0.8,0.03,'sine'); }
        if(L>=5 && s%2===1) tone(mtof(CH[bar][(s>>1)%4]+12),t,b16*0.8,0.035,'triangle');
      }},
    electro:{ name:'전자음',
      step(bar,s,t,L,b16){
        const ROOT=[45,41,48,43], CH=[[57,60,64,69],[57,60,65,69],[55,60,64,67],[55,59,62,67]];
        const M=[[76,_,_,_,72,_,_,_,74,_,76,_,_,_,72,_],[72,_,_,_,69,_,_,_,72,_,74,_,_,_,69,_],
                 [67,_,_,_,72,_,_,_,76,_,74,_,_,_,72,_],[71,_,_,_,74,_,_,_,79,_,76,_,74,_,71,_]];
        if(s%4===0) kick(t);
        if(L>=1 && s%8===4) clap(t);
        if(L>=3) hat(t,s%2?0.03:0.05);
        if(L>=6 && s%4===2) ohat(t);

  // ================= 게임 1: 색깔 스트룹 =================
  const STROOP={
    id:'stroop', name:'색깔 스트룹', grade:'전 학년', dur:'5분', lit:[3],
    desc:'화면에 나온 색깔 글씨를 보고 그 색 칸을 밟아요. 3단계부터 "노란색"을 빨간 글씨로 쓰는 함정이 나와요.',
    how:['10단계 × 30초. 단계가 오를수록 글씨가 빨리 바뀌고 작아져요.','하드/익스퍼트는 글씨 2개가 동시에 나와서 두 발로 두 칸을 밟아요.','이지 버전을 켜면 매트 그림에 밟을 칸이 표시돼요.'],
    options:[
      {id:'rule',label:'무엇을 보고 밟을까요?',choices:[['word','글자를 읽고 밟기'],['ink','글자 색깔을 보고 밟기']]},
      {id:'mode',label:'모드',choices:[['1','노말 (1개씩)'],['2','하드 (2개 동시)'],['3','익스퍼트 (2개 · 왼발/오른발)']]},
      {id:'easy',label:'이지 버전 (매트 칸 표시)',choices:[['off','끄기'],['on','켜기']]},
      {id:'speed',label:'전체 속도',choices:[['1.25','천천히'],['1','보통'],['0.8','빠르게']],def:'1'},
    ],
    create(o,api){
      const LEVELS=[{gap:3.0,trick:0},{gap:2.5,trick:0},{gap:2.2,trick:0.3},{gap:1.9,trick:0.45},{gap:1.65,trick:0.6},
        {gap:1.45,trick:0.7},{gap:1.3,trick:0.8},{gap:1.15,trick:0.85},{gap:1.0,trick:0.9},{gap:0.85,trick:0.95}];
      const LS=30, BN=2.5, TOTAL=300, speed=+o.speed, mode=+o.mode, easy=o.easy==='on', rule=o.rule;
      const lvAt=t=>Math.min(9,Math.floor(t/LS));
      api.body.className='s-stroop'+(easy?' easy':'');
      api.body.innerHTML='<div class="word"></div>';
      const word=api.body.querySelector('.word'), mat=makeMat('hintmat'); api.body.appendChild(mat.el); mat.el.hidden=true;
      api.segments(10);
      api.chip((easy?'이지 · ':'')+(mode===3?'익스퍼트 · ':mode===2?'하드 · ':'')+(rule==='word'?'글자를 읽고 밟기':'글자 색깔을 보고 밟기'));
      let lvl=-1, nextAt=0, prev={m:-1,k:-1,t:-1,key:''};
      function setLevel(i){ lvl=i; word.style.setProperty('--scale',(1-0.5*i/9).toFixed(3)); prev={m:-1,k:-1,t:-1,key:''}; api.hud(`${i+1}단계`,'/ 10'); }
      function pickOne(L,avoid){
        for(let n=0;n<60;n++){
          const m=rnd(4); let k=m;
          if(Math.random()<L.trick){ do{k=rnd(4);}while(k===m); }
          const t=rule==='word'?m:k;
          if(avoid.includes(t)) continue;
          if(mode===1 && m===prev.m && k===prev.k) continue;
          return {m,k,t};
        }
        const t=[0,1,2,3].find(x=>!avoid.includes(x)); return {m:t,k:t,t};
      }
      const wHTML=(w,label)=>`<span class="w" style="color:${COLORS[w.k].css}">${COLORS[w.m].name}${label?`<small>${label}</small>`:''}</span>`;
      function show(){
        const L=LEVELS[lvl];
        if(mode>=2){
          let a,b;
          for(let n=0;n<30;n++){ a=pickOne(L,[]); b=pickOne(L,[a.t]); const key=[a.t,b.t].sort().join(); if(key!==prev.key){ prev={key,m:-1,k:-1,t:-1}; break; } }
          word.classList.add('double');
          word.innerHTML=mode===3?wHTML(a,'왼발')+wHTML(b,'오른발'):wHTML(a)+wHTML(b);
          if(easy){ mat.el.hidden=false; mat.show([{c:a.t,label:mode===3?'왼발':'여기!'},{c:b.t,label:mode===3?'오른발':'여기!'}]); }
        } else {
          const w=pickOne(L,[prev.t]); prev=w;
          word.classList.remove('double'); word.innerHTML=wHTML(w);
          if(easy){ mat.el.hidden=false; mat.show([{c:w.t,label:'여기!'}]); }
        }
        api.pop(word); api.tick(); api.jump();
      }
      const note=i=>LEVELS[i].trick>0&&LEVELS[i-1].trick===0?'이제 함정이 나와요! 글자색이 바뀔 수 있어요':i===9?'마지막 단계! 최고 속도로!':'조금 더 빨라져요';
      return {
        bpmAt:t=>(100+lvAt(t)*7.5)/speed, intensityAt:lvAt,
        begin(){ setLevel(0); nextAt=0; },
        update(T){
          if(T>=TOTAL) return api.finish('완주!','10단계까지 모두 뛰었어요. 숨을 고르고 물 한 모금!');
          const li=lvAt(T);
          if(li!==lvl){ if(lvl>=0) api.unit(); setLevel(li); if(li>0){ api.banner(`${li+1}단계`,note(li),COLORS[MAT[li%4]].css); api.chime(); } }
          const t=T-li*LS;
          if(li>0 && t<BN){ nextAt=li*LS+BN; }
          else { api.hideBanner(); if(T>=nextAt){ show(); nextAt=T+LEVELS[li].gap*speed*(mode>=2?1.25:1); } }
          api.right(fmt(TOTAL-T)); api.progress(li,t/LS);
        },
        skip(d){ const i=lvl+d; if(i>=10) return api.finish('완주!','10단계까지 모두 뛰었어요. 숨을 고르고 물 한 모금!'); api.setT(Math.max(0,i)*LS); nextAt=0; }
      };
    }
  };

  // ================= 게임 2: 기억력 스텝 =================
  const MEMORY={
    id:'memory', name:'기억력 스텝', grade:'전 학년', dur:'약 4~6분', lit:[3,0,1],
    desc:'매트에 색이 하나씩 반짝이면 순서를 기억했다가 그대로 밟아요. 라운드마다 외울 개수가 늘어나요.',
    how:['"잘 보세요!" 동안 반짝이는 순서를 외워요. 이때는 움직이지 않아요.','"따라 밟아요!"가 나오면 박자에 맞춰 순서대로 밟아요.','마지막에 정답 순서가 번호로 나와서 스스로 확인할 수 있어요.'],
    options:[
      {id:'diff',label:'난이도',choices:[['easy','쉬움 (2개부터 · 천천히)'],['normal','보통 (3개부터)'],['hard','어려움 (4개부터 · 빠르게)']],def:'normal'},
      {id:'rounds',label:'라운드 수',choices:[['6','6라운드'],['8','8라운드'],['10','10라운드']],def:'8'},
    ],
    create(o,api){
      const cfg={easy:{start:2,show:0.95},normal:{start:3,show:0.75},hard:{start:4,show:0.58}}[o.diff];
      const R=+o.rounds, lenOf=r=>cfg.start+Math.floor(r/2), stepDo=cfg.show*1.7;
      api.body.className='s-memory';
      api.body.innerHTML='<div class="cap"></div>';
      const cap=api.body.querySelector('.cap'), mat=makeMat(); api.body.appendChild(mat.el);
      const slots=document.createElement('div'); slots.className='slots'; api.body.appendChild(slots);
      api.segments(R); api.chip('순서를 기억해서 밟기');
      let r=0, seq=[], phase='', p0=0, shown=-1;
      function newSeq(n){ const s=[]; for(let i=0;i<n;i++){ let c; do{c=rnd(4);}while(c===s[i-1]); s.push(c); } return s; }
      function setSlots(n,filled,numbers){ slots.innerHTML=Array.from({length:n},(_,i)=>`<span class="${i<filled?'done':''}">${numbers&&i<filled?i+1:''}</span>`).join(''); }
      function startRound(T){
        seq=newSeq(lenOf(r)); phase='intro'; p0=T; shown=-1;
        api.banner(`${r+1}라운드`,`${seq.length}개를 기억해요`,COLORS[MAT[r%4]].css); api.chime();
        api.hud(`${seq.length}개`,'기억하기'); api.right(`${r+1} / ${R}`);
      }
      function go(ph,T){ phase=ph; p0=T; shown=-1; }
      const durs=()=>({intro:2.2, show:0.5+seq.length*cfg.show, ready:1.3, do:seq.length*stepDo+0.9, check:0.4+seq.length*0.5+2.2});
      return {
        begin(){ r=0; startRound(0); },
        update(T){
          const el=T-p0, D=durs();
          if(phase==='intro'){ if(el>=D.intro){ api.hideBanner(); go('show',T); cap.textContent='잘 보세요!'; mat.show([]); setSlots(seq.length,0); } }
          else if(phase==='show'){
            const k=Math.floor((el-0.5)/cfg.show), inOn=el>=0.5 && ((el-0.5)%cfg.show)<cfg.show*0.7;
            const key=inOn?k:-1000-k;
            if(k<seq.length && key!==shown){ shown=key;
              if(inOn){ mat.show([{c:seq[k]}]); api.colorTone(seq[k]); setSlots(seq.length,k+1); } else mat.show([]); }
            if(el>=D.show){ go('ready',T); mat.show(null); cap.textContent='따라 밟아요!'; setSlots(seq.length,0); api.beep(660,0.2,0.2,'triangle'); }
          }
          else if(phase==='ready'){ if(el>=D.ready){ go('do',T); api.jump(seq.length); } }
          else if(phase==='do'){
            const k=Math.floor(el/stepDo);
            if(k!==shown && k<seq.length){ shown=k; setSlots(seq.length,k+1,true); api.beep(880,0.07,0.16,'triangle'); }
            if(el>=D.do){ go('check',T); cap.textContent='정답 확인'; mat.show([]); }
          }
          else if(phase==='check'){
            const k=Math.min(seq.length,Math.floor((el-0.4)/0.5)+1);
            if(el>=0.4 && k!==shown){ shown=k;
              mat.show(seq.slice(0,k).map((c,i)=>({c,label:String(i+1)}))); api.colorTone(seq[k-1]); }
            if(el>=D.check){ api.unit(); r++; if(r>=R) return api.finish('기억왕!',`${R}라운드를 모두 마쳤어요. 마지막엔 ${seq.length}개까지 외웠어요!`); startRound(T); }
          }
          const order=['intro','show','ready','do','check'], idx=order.indexOf(phase);
          api.progress(r,(idx+Math.min(1,el/D[phase]))/5);
        },
        skip(d){ r=Math.max(0,r+d); if(r>=R) return api.finish('기억왕!',`${R}라운드를 모두 마쳤어요.`); startRound(E.T); }
      };
    }
  };

  // ================= 게임 3: 리듬 스텝 =================
  const RHYTHM={
    id:'rhythm', name:'리듬 스텝', grade:'전 학년', dur:'3분', lit:[0,3],
    desc:'음악에 맞춰 네 줄로 색 블록이 내려와요. 블록이 아래 선에 닿는 순간 그 색 칸을 밟아요.',
    how:['줄 순서는 매트 칸 순서와 같아요: 빨강(왼위) · 노랑(오위) · 초록(왼아래) · 파랑(오아래).','6단계 × 30초. 단계마다 음악이 빨라지고 악기가 더해져요.','어려움에서는 블록 2개가 동시에 내려오면 두 발로 밟아요.'],
    options:[
      {id:'diff',label:'난이도',choices:[['easy','쉬움 (2박마다)'],['normal','보통 (1박마다)'],['hard','어려움 (빠르게 · 동시 블록)']],def:'normal'},
    ],
    create(o,api){
      const D={easy:{bpm:[80,85,90,95,100,105],every:8,travel:2.6,rest:0},
               normal:{bpm:[92,100,108,116,124,132],every:4,travel:2.0,rest:0.25},
               hard:{bpm:[108,116,124,132,140,148],every:4,travel:1.7,rest:0.1}}[o.diff];
      const LS=30, NL=6, TOTAL=NL*LS, lvAt=t=>Math.min(NL-1,Math.floor(t/LS)), bpmAt=t=>D.bpm[lvAt(t)];
      const steps=[]; for(let t=0;t<TOTAL+3;t+=60/bpmAt(t)/4) steps.push(t);
      const notes=[]; let prevLane=-1;
      steps.forEach((t,k)=>{
        if(t<D.travel+0.4||t>TOTAL-0.3||k%D.every) return;
        if(k%16!==0 && Math.random()<D.rest) return;
        let lane; do{lane=rnd(4);}while(lane===prevLane && Math.random()<0.75); prevLane=lane;
        notes.push({t,lane});
        if(o.diff==='hard' && lvAt(t)>=2 && k%16===0 && Math.random()<0.6){ let l2; do{l2=rnd(4);}while(l2===lane); notes.push({t,lane:l2}); }
      });
      api.body.className='s-rhythm';
      const cv=document.createElement('canvas'); api.body.appendChild(cv); const ctx=cv.getContext('2d');
      let W=0,H=0,dpr=1;
      function resize(){ dpr=window.devicePixelRatio||1; W=api.body.clientWidth; H=api.body.clientHeight; cv.width=W*dpr; cv.height=H*dpr; }
      resize(); window.addEventListener('resize',resize);
      api.segments(NL); api.chip('블록이 선에 닿을 때 밟기');
      let lvl=-1, toastUntil=0, first=0, hitIdx=0, hitT=-1;
      function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h); }
      function draw(T){
        if(api.body.clientWidth!==W||api.body.clientHeight!==H) resize();
        ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
        const lw=Math.min(W/4.3,H*0.34), gap=lw*0.08, x0=(W-(lw*4+gap*3))/2, hitY=H*0.64, topY=-lw*0.5, bw=lw*0.84, bh=lw*0.42;
        while(first<notes.length && notes[first].t < T-0.4) first++;
        const glow=[0,0,0,0];
        for(let i=first;i<notes.length && notes[i].t<T+0.4;i++){ const d=Math.abs(notes[i].t-T); if(d<0.16) glow[notes[i].lane]=Math.max(glow[notes[i].lane],1-d/0.16); }
        for(let l=0;l<4;l++){
          const c=COLORS[MAT[l]], x=x0+l*(lw+gap);
          ctx.globalAlpha=0.09+glow[l]*0.35; ctx.fillStyle=c.hex; rr(x,0,lw,H,lw*0.08); ctx.fill();
          ctx.globalAlpha=1;
          // 판정 칸
          const tx=x+(lw-bw)/2, ty=hitY-bh/2;
          ctx.lineWidth=Math.max(3,lw*0.035); ctx.strokeStyle=c.hex; rr(tx,ty,bw,bh,bh*0.25); ctx.stroke();
          if(glow[l]>0){ ctx.globalAlpha=glow[l]; ctx.fillStyle=c.hex; rr(tx,ty,bw,bh,bh*0.25); ctx.fill(); ctx.globalAlpha=1; }
          // 매트 위치 아이콘
          const ms=Math.min(lw*0.26,H*0.07), mx=x+lw/2-ms/2, my=hitY+bh/2+H*0.03, cs=ms/2-1;
          for(let p=0;p<4;p++){ ctx.fillStyle=p===l?c.hex:'#2C3140'; ctx.fillRect(mx+(p%2)*(cs+2),my+Math.floor(p/2)*(cs+2),cs,cs); }
          ctx.fillStyle=c.hex; ctx.font=`${Math.round(Math.min(lw*0.2,H*0.05))}px ${getComputedStyle(document.body).getPropertyValue('--display')}`;
          ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText(c.short,x+lw/2,my+ms+H*0.015);
        }
        // 떨어지는 블록
        for(let i=first;i<notes.length;i++){
          const n=notes[i], dtn=n.t-T; if(dtn>D.travel) break;
          const x=x0+n.lane*(lw+gap)+(lw-bw)/2, y=hitY-(dtn/D.travel)*(hitY-topY)-bh/2;
          ctx.globalAlpha=dtn<0?Math.max(0,1+dtn/0.3):1;
          ctx.fillStyle=COLORS[MAT[n.lane]].hex; rr(x,y,bw,bh,bh*0.25); ctx.fill();
          ctx.lineWidth=Math.max(3,lw*0.03); ctx.strokeStyle='#fff'; ctx.stroke(); ctx.globalAlpha=1;
        }
        if(T<toastUntil){
          ctx.globalAlpha=Math.min(1,(toastUntil-T)/0.4); ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.font=`${Math.round(H*0.12)}px ${getComputedStyle(document.body).getPropertyValue('--display')}`;
          ctx.fillText(`${lvl+1}단계`,W/2,H*0.3); ctx.globalAlpha=1;
        }
      }
      return {
        bpmAt, intensityAt:t=>Math.round(lvAt(t)*1.8),
        readyNote:'매트 위에서 음악을 기다려요!',
        begin(){ lvl=-1; first=0; },
        update(T){
          if(T>=TOTAL+0.5) return api.finish('멋진 춤!','6단계까지 리듬에 맞춰 모두 밟았어요!');
          const li=lvAt(T); if(li!==lvl){ if(lvl>=0) api.unit(); lvl=li; api.hud(`${li+1}단계`,'/ '+NL); if(li>0){ toastUntil=T+1.6; } }
          while(hitIdx<notes.length && notes[hitIdx].t<=T){ if(notes[hitIdx].t!==hitT){ hitT=notes[hitIdx].t; api.jump(); } hitIdx++; }
          draw(T); api.right(fmt(TOTAL-T)); api.progress(li,(T-li*LS)/LS);
        },
        skip(d){ const i=lvl+d; if(i>=NL) return api.finish('멋진 춤!','6단계까지 리듬에 맞춰 모두 밟았어요!');
          const t=Math.max(0,i)*LS; const k=steps.findIndex(s=>s>=t); api.setT(steps[k],k); first=0; },
        destroy(){ window.removeEventListener('resize',resize); }
      };
    }
  };

  // ================= 게임 4: 방향 점프 =================
  const DIRS=[
    {dr:-1,dc:0,ang:-90},{dr:1,dc:0,ang:90},{dr:0,dc:-1,ang:180},{dr:0,dc:1,ang:0},
    {dr:-1,dc:-1,ang:-135},{dr:-1,dc:1,ang:-45},{dr:1,dc:-1,ang:135},{dr:1,dc:1,ang:45},
  ];
  const DIRGAME={
    id:'dir', name:'방향 점프', grade:'3학년 이상 추천', dur:'4분', lit:[3,1],
    desc:'색 대신 화살표가 나와요. 지금 서 있는 칸에서 화살표 방향의 옆 칸으로 점프해요.',
    how:['단계가 시작될 때 알려 주는 칸에서 출발해요.','쉬움은 위·아래·옆, 보통부터 대각선도 나와요.','어려움에는 "반대로!"(반대 방향으로 점프)와 "제자리!"(그 자리에서 점프) 함정이 섞여요.'],
    options:[
      {id:'diff',label:'난이도',choices:[['easy','쉬움 (매트에 도착 칸 표시)'],['normal','보통 (대각선 · 현재 칸만 표시)'],['hard','어려움 (함정 · 표시 없음)']],def:'normal'},
    ],
    create(o,api){
      const D={easy:{gaps:[3.4,3.1,2.8,2.6,2.4,2.2,2.0,1.8],diag:false,hint:'full',trick:false},
               normal:{gaps:[3.0,2.7,2.4,2.2,2.0,1.8,1.6,1.45],diag:true,hint:'pos',trick:false},
               hard:{gaps:[2.6,2.3,2.1,1.9,1.7,1.55,1.4,1.25],diag:true,hint:'none',trick:true}}[o.diff];
      const LS=30, NL=8, BN=3, TOTAL=NL*LS, lvAt=t=>Math.min(NL-1,Math.floor(t/LS));
      api.body.className='s-dir';
      api.body.innerHTML='<div class="arrowbox"><div class="trick" hidden>반대로!</div><div class="stay" hidden>제자리!</div><svg viewBox="-50 -50 100 100" aria-hidden="true"><path d="M-40,-13 H8 V-32 L44,0 L8,32 V13 H-40 Z" fill="#F2F3F7"/></svg></div>';
      const box=api.body.querySelector('.arrowbox'), svg=box.querySelector('svg'), path=svg.querySelector('path'),
            trickEl=box.querySelector('.trick'), stayEl=box.querySelector('.stay');
      const mat=makeMat(); if(D.hint!=='none') api.body.appendChild(mat.el);
      api.segments(NL); api.chip('화살표 방향으로 한 칸 점프');
      let lvl=-1, nextAt=0, pos=0, lastStart=-1;
      const rc=p=>[Math.floor(p/2),p%2];
      function setLevel(i){
        lvl=i; let s; do{ s=rnd(4); }while(s===lastStart); lastStart=s; pos=s;
        const c=MAT[s]; api.banner(i===0?'출발!':`${i+1}단계`,`${COLORS[c].short} 칸에서 시작해요`,COLORS[c].css);
        api.chime(); api.hud(`${i+1}단계`,'/ '+NL);
        svg.hidden=true; trickEl.hidden=true; stayEl.hidden=true; if(D.hint!=='none') mat.show([{c,label:'출발',style:'on'}]);

      if(L===1){ if(plus){ a=R(1,9); b=R(1,10-a); } else { a=R(2,10); b=R(1,a-1); } }
      else if(L===2){ if(plus){ a=R(2,9); b=R(11-a,9); } else { a=R(11,18); b=R(a-9,9); } }
      else { if(plus){ a=R(12,89); b=R(11,99-a>11?99-a:11); } else { a=R(30,99); b=R(11,a-5); } }
      const ans=plus?a+b:a-b;
      return [`${a} ${plus?'+':'−'} ${b} = ?`,String(ans),...numOpts(ans,[ans+1,ans-1,ans+10,ans-10,plus?a-b:a+b])];
    },
    times:L=>{

    },
    muldiv:L=>{
      if(Math.random()<.5){
        const a=L===1?R(11,30):L===2?R(12,99):R(12,40), b=L===1?R(2,5):L===2?R(2,9):R(11,25), p=a*b;

      }

  const ITEMS2=[

  const ASSOC={

      {id:'think',label:'생각 시간',choices:[['4','4초'],['6','6초'],['8','8초']],def:'6',showIf:['src','mine'],help:'자동으로 넘길 때 그림을 보고 뛰는 시간이에요. 정답은 3초 동안 보여 줘요.'},

      {id:'name',label:'그림 이름',choices:[['show','같이 보이기'],['hide','정답 때만 보이기']],def:'show',showIf:['src','mine']},
    ],
    validate(o){ return o.src==='mine'&&!H.pics.length?'선생님이 아직 우리 반 그림을 올리지 않았어요. "기본 그림"으로 해 주세요.':''; },
    create(o,api){

      const POOL=(o.multi==='on'?ITEMS.concat(ITEMS2):ITEMS).map(it=>({e:it[0],n:it[1],cs:Array.isArray(it[2])?it[2]:[it[2]]}));
      const easy=o.diff==='easy', two=o.diff==='hard', lvAt=t=>Math.min(NL-1,Math.floor(t/LS));

      api.segments(NL); api.chip('그림을 보고 떠오르는 색 밟기');
      let lvl=-1, nextAt=0, prevKey='', recent=[];
      function pickItem(avoidC, single){
        for(let n=0;n<80;n++){ const it=POOL[rnd(POOL.length)]; if((single&&it.cs.length>1)||it.cs.some(c=>avoidC.includes(c))||recent.includes(it.n)) continue; recent.push(it.n); if(recent.length>8) recent.shift(); return it; }
        return POOL.find(it=>!it.cs.some(c=>avoidC.includes(c))&&(!single||it.cs.length===1));
      }
      function show(){
        let its;
        for(let n=0;n<30;n++){ const a=pickItem([]); its=(two&&a.cs.length===1)?[a,pickItem(a.cs,true)]:[a]; const key=its.map(i=>i.cs.join('+')).sort().join(); if(key!==prevKey||n>20){ prevKey=key; break; } recent.pop(); }
        pics.innerHTML=its.map(it=>`<div class="pic"><div class="e">${it.e}</div><div class="n">${it.n}${it.cs.length>1?' <small class="two-feet">두 발!</small>':''}</div></div>`).join('');
        if(easy) mat.show(its.flatMap(it=>it.cs.map(c=>({c,label:'여기!'}))));
        api.pop(pics); api.tick(); api.jump();
      }
      return {
        bpmAt:t=>(92+lvAt(t)*6)/speed, intensityAt:t=>lvAt(t),

        update(T){
          if(T>=TOTAL) return api.finish('참 잘했어요!',`${NL}단계를 모두 뛰었어요!`);
          const li=lvAt(T);
          if(li!==lvl){ if(lvl>=0) api.unit(); lvl=li; pics.style.setProperty('--scale',(1-0.4*li/(NL-1)).toFixed(3)); api.hud(`${li+1}단계`,'/ '+NL);
            if(li>0){ api.banner(`${li+1}단계`,li===NL-1?'마지막 단계!':'조금 더 빨라져요',COLORS[MAT[li%4]].css); api.chime(); } }
          const t=T-li*LS;
          if(li>0 && t<BN){ nextAt=li*LS+BN; } else { api.hideBanner(); if(T>=nextAt){ show(); nextAt=T+GAPS[li]*speed*(two?1.25:1); } }
          api.right(fmt(TOTAL-T)); api.progress(li,t/LS);
        },
        skip(d){ const i=lvl+d; if(i>=NL) return api.finish('참 잘했어요!',`${NL}단계를 모두 뛰었어요!`); api.setT(Math.max(0,i)*LS); nextAt=0; }

    }

  // ================= 게임 7: 손발 트위스터 =================
  const LIMBS=['왼발','오른발','왼손','오른손'];
  const TWIST={
    id:'twist', name:'손발 트위스터', grade:'전 학년', dur:'약 3~4분', lit:[1,2],
    desc:'"왼손 → 빨강"처럼 손과 발을 놓을 칸이 하나씩 나와요. 이미 놓은 손발은 그대로 두고 버텨요.',
    how:['뛰는 게임 뒤 정리운동이나 균형 활동으로 좋아요.','한 라운드가 끝나면 "풀고 쉬어요"가 나와요.','어려움에서는 마지막에 손발 하나를 다른 칸으로 옮기는 지시가 더해져요.'],
    options:[
      {id:'diff',label:'난이도',choices:[['easy','쉬움 (두 발만 · 6초)'],['normal','보통 (두 손 두 발 · 5초)'],['hard','어려움 (옮기기 추가 · 4초)']],def:'normal'},
      {id:'rounds',label:'라운드 수',choices:[['4','4라운드'],['6','6라운드'],['8','8라운드']],def:'6'},
    ],
    create(o,api){
      const D={easy:{limbs:[0,1],hold:6,extra:0},normal:{limbs:[0,1,2,3],hold:5,extra:0},hard:{limbs:[0,1,2,3],hold:4,extra:2}}[o.diff];
      const R=+o.rounds, REST=4, INTRO=2;
      api.body.className='s-twist';
      api.body.innerHTML='<div class="tw-l"><div class="tw-limb"></div><div class="tw-to"></div><div class="tw-hold">버텨요 <b></b></div></div>';
      const limbEl=api.body.querySelector('.tw-limb'), toEl=api.body.querySelector('.tw-to'), holdEl=api.body.querySelector('.tw-hold b'), holdRow=api.body.querySelector('.tw-hold');
      const mat=makeMat(); api.body.appendChild(mat.el);
      api.segments(R); api.chip('손발을 칸에 놓고 버티기');
      let r=0, plan=[], k=0, phase='', p0=0, placed={}, lastSec=-1;
      function makePlan(){
        const cols=shuffle([0,1,2,3]), p=[]; const cur={};
        D.limbs.forEach((l,i)=>{ p.push({l,c:cols[i]}); cur[l]=cols[i]; });
        for(let n=0;n<D.extra;n++){ const l=D.limbs[rnd(D.limbs.length)]; let c; do{c=rnd(4);}while(c===cur[l]); cur[l]=c; p.push({l,c,move:true}); }
        return p;
      }
      function startRound(T){ plan=makePlan(); k=-1; placed={}; phase='intro'; p0=T;
        api.banner(`${r+1}라운드`,o.diff==='easy'?'두 발을 준비해요':'두 손 두 발을 준비해요',COLORS[MAT[r%4]].css); api.chime();
        api.right(`${r+1} / ${R}`); }
      function step(T){
        k++; phase='hold'; p0=T; lastSec=-1; const s=plan[k];
        placed[s.l]=s.c;
        limbEl.textContent=(s.move?'옮겨요! ':'')+LIMBS[s.l];
        toEl.innerHTML=`→ <span style="color:${COLORS[s.c].css}">${COLORS[s.c].short}</span>`;
        mat.show(Object.entries(placed).map(([l,c])=>({c,label:LIMBS[l],style:+l===s.l?'on':'now'})));
        holdRow.hidden=false; api.pop(limbEl); api.colorTone(s.c); api.hud(`${k+1}번째`,'/ '+plan.length); api.jump();
      }
      return {
        bpmAt:()=>80, intensityAt:()=>0, musicStyle:'calm',
        readyNote:'매트 옆에 서서 준비해요!',
        begin(){ r=0; startRound(0); },
        update(T){
          const el=T-p0;
          if(phase==='intro'){ if(el>=INTRO){ api.hideBanner(); step(T); } }
          else if(phase==='hold'){
            const left=D.hold-el, s=Math.ceil(left); if(s!==lastSec){ lastSec=s; holdEl.textContent=Math.max(0,s); if(s<=3&&s>0) api.beep(700,0.06,0.12,'triangle'); }
            if(left<=0){ if(k+1<plan.length) step(T); else { phase='rest'; p0=T; limbEl.textContent='풀고 쉬어요'; toEl.textContent=''; holdRow.hidden=true; mat.show(null); api.chime(); } }
          } else if(phase==='rest' && el>=REST){ api.unit(); r++; if(r>=R) return api.finish('균형 최고!',`${R}라운드를 모두 버텼어요!`); startRound(T); }
          const total=INTRO+plan.length*D.hold+REST, done=phase==='intro'?el:phase==='hold'?INTRO+k*D.hold+el:INTRO+plan.length*D.hold+el;
          api.progress(r,done/total);
        },
        skip(d){ r=Math.max(0,r+d); if(r>=R) return api.finish('균형 최고!',`${R}라운드를 모두 버텼어요!`); startRound(E.T); }
      };
    }
  };

  // ================= 게임 8: 얼음 스텝 =================
  const POSES=['한 발로 서기','두 팔 옆으로 쭉','쪼그려 앉기','양손 머리 위로','비행기 자세','까치발 들기','한 손으로 무릎 잡기','동상처럼 멋진 자세'];
  const FREEZE={
    id:'freeze', name:'얼음 스텝', grade:'전 학년', dur:'약 3~4분', lit:[0,1,2,3],
    desc:'음악이 나오는 동안 매트 옆에서 신나게 춤추다가, 음악이 뚝 멈추면 나온 색 칸으로 뛰어가 "얼음!" 해요.',
    how:['음악이 나오면 매트 밖에서 자유롭게 춤추거나 제자리 뛰기를 해요.','음악이 멈추고 호루라기가 울리면 화면의 색 칸으로 뛰어가요.','"얼음!"이 나오면 그 자리에서 움직이지 않고 버텨요. 보통부터는 얼음 자세 미션이 나와요.'],
    options:[
      {id:'diff',label:'난이도',choices:[['easy','쉬움 (매트 칸 표시 · 4초 안에)'],['normal','보통 (자세 미션 · 3초 안에)'],['hard','어려움 (두 색 = 두 발 · 2.5초 안에)']],def:'normal'},
      {id:'rounds',label:'라운드 수',choices:[['6','6라운드'],['10','10라운드'],['14','14라운드']],def:'10'},
    ],
    create(o,api){
      const D={easy:{dance:[6,10],go:4,hold:4,pose:false,two:false,hint:true},
               normal:{dance:[4,9],go:3,hold:4,pose:true,two:false,hint:false},
               hard:{dance:[3,7],go:2.5,hold:5,pose:true,two:true,hint:false}}[o.diff];
      const R=+o.rounds, MELT=1.4;
      api.body.className='s-freeze';
      api.body.innerHTML='<div class="fz-big"></div><div class="fz-sub"></div><div class="fz-dots"><i></i><i></i><i></i><i></i></div>';
      const big=api.body.querySelector('.fz-big'), sub=api.body.querySelector('.fz-sub'), dots=api.body.querySelector('.fz-dots');
      const mat=makeMat(); if(D.hint) api.body.appendChild(mat.el); mat.el.hidden=true;
      api.segments(R); api.chip('음악이 멈추면 색 칸으로!');
      let r=0, phase='', p0=0, danceLen=0, targets=[], lastBeat=-1, lastSec=-1, prevKey='';
      const bpmNow=()=>112+Math.min(r,9)*3;
      function setDots(on){ dots.hidden=!on; }
      function dance(T){
        phase='dance'; p0=T; danceLen=D.dance[0]+Math.random()*(D.dance[1]-D.dance[0]); lastBeat=-1;
        big.style.fontSize=''; big.textContent='춤춰요!'; sub.textContent='음악이 멈출 때까지 신나게!'; setDots(true); mat.el.hidden=true;
        api.hud(`${r+1}라운드`,'/ '+R); api.right(`${r+1} / ${R}`); api.music(true); api.beep(784,0.12,0.2,'triangle'); setTimeout(()=>api.beep(1047,0.16,0.2,'triangle'),130);
      }
      function go(T){
        phase='go'; p0=T; lastSec=-1; api.music(false); api.whistle(); setDots(false);
        let t;
        for(let n=0;n<20;n++){ const a=rnd(4); t=D.two?[a,(a+1+rnd(3))%4]:[a]; const key=t.slice().sort().join(); if(key!==prevKey) { prevKey=key; break; } }
        targets=t; api.jump(t.length); big.style.fontSize=t.length>1?'min(14vw,30vh)':'';
        big.innerHTML=t.map(c=>`<span style="color:${COLORS[c].css}">${COLORS[c].short}</span>`).join(' <span class="fz-plus">+</span> ');
        sub.textContent=D.two?'두 발로 두 칸에!':'이 색 칸으로 뛰어가요!';
        if(D.hint){ mat.el.hidden=false; mat.show(t.map(c=>({c,label:'여기!'}))); }
        api.pop(big);
      }
      function freeze(T){
        phase='freeze'; p0=T; lastSec=-1;
        const withPose=D.pose && r>=1;
        big.textContent='얼음!'; big.style.color='';
        sub.textContent=withPose?POSES[rnd(POSES.length)]:'움직이지 마요!';
        if(D.hint) mat.show(targets.map(c=>({c,label:'얼음'})));
        api.pop(big); api.beep(1400,0.5,0.2,'triangle');
      }
      function melt(T){ phase='melt'; p0=T; big.textContent='땡!'; sub.textContent=r+1<R?'다시 춤출 준비!':'마지막 라운드 끝!'; mat.el.hidden=true; api.chime(); }
      return {
        bpmAt:()=>bpmNow(), intensityAt:()=>Math.min(9,2+r), musicManual:true,
        readyNote:'매트 옆에 서서 음악을 기다려요!',
        begin(){ r=0; dance(0); },
        update(T){
          const el=T-p0;
          if(phase==='dance'){
            const beat=Math.floor(el*bpmNow()/60);
            if(beat!==lastBeat){ lastBeat=beat; const c=MAT[beat%4]; big.style.color=COLORS[c].css;
              [...dots.children].forEach((d,i)=>d.className=i===beat%4?'on':''); }
            if(el>=danceLen) go(T);
            api.progress(r,0.6*el/danceLen);
          } else if(phase==='go'){
            const left=D.go-el, s=Math.ceil(left);
            if(s!==lastSec){ lastSec=s; if(s>0){ api.beep(900,0.06,0.14,'square'); } }
            if(left<=0) freeze(T);
            api.progress(r,0.6+0.15*el/D.go);
          } else if(phase==='freeze'){
            const left=D.hold-el, s=Math.ceil(left);
            if(s!==lastSec){ lastSec=s; }
            if(left<=0) melt(T);
            api.progress(r,0.75+0.2*el/D.hold);
          } else if(phase==='melt' && el>=MELT){
            api.unit(); r++; if(r>=R){ api.music(false); return api.finish('얼음 왕!',`${R}라운드를 모두 마쳤어요. 다리 쭉 펴고 쉬어요!`); }
            dance(T);
          }
        },
        skip(d){ r=Math.max(0,r+d); if(r>=R){ api.music(false); return api.finish('얼음 왕!',`${R}라운드를 모두 마쳤어요.`); } dance(E.T); },
        destroy(){ api.music(false); }
      };
    }
  };

  const BASIC={
    id:'basic', name:'색깔 점프', grade:'전 학년', dur:'4분', lit:[3,0,1,2], featured:true,
    desc:'화면 전체가 한 가지 색으로 바뀌면 그 색 칸으로 점프해요. 매트 게임을 처음 할 때 가장 먼저 해 보는 기본 게임이에요.',
    how:['8단계 × 30초. 단계가 오를수록 색이 빨리 바뀌어요.','"2개"를 고르면 화면이 반으로 나뉘어요. 왼쪽 색은 왼발, 오른쪽 색은 오른발로 밟아요.','글자 없이 색만 나와요. 처음 하는 친구는 "매트 위치 그림"을 켜 주세요.'],
    options:[
      {id:'mode',label:'한 번에 나오는 색',choices:[['1','1개 (화면 전체)'],['2','2개 (화면 반반 · 왼발/오른발)']]},
      {id:'diff',label:'빠르기',choices:[['easy','천천히'],['normal','보통'],['hard','빠르게']],def:'normal'},
      {id:'hint',label:'매트 위치 그림',choices:[['off','숨기기'],['on','보이기']]},
    ],
    create(o,api){
      const GAPS={easy:[3.0,2.7,2.4,2.2,2.0,1.8,1.6,1.4],normal:[2.5,2.2,1.9,1.7,1.5,1.3,1.1,0.95],hard:[2.0,1.7,1.5,1.3,1.1,0.95,0.85,0.75]}[o.diff];
      const two=o.mode==='2', LS=30, NL=8, BN=2.5, TOTAL=NL*LS, lvAt=t=>Math.min(NL-1,Math.floor(t/LS));
      api.body.className='s-basic'+(two?' two':'');
      const half=side=>`<div class="bs-half">${two?`<small>${side}</small>`:''}${o.hint==='on'?'<div class="bs-mini"><i></i><i></i><i></i><i></i></div>':''}</div>`;
      api.body.innerHTML=`<div class="bs-wrap">${two?half('왼발')+half('오른발'):half('')}</div>`;
      const halves=[...api.body.querySelectorAll('.bs-half')];
      $('mgPlay').classList.add('fullbleed');
      api.segments(NL); api.chip(two?'왼쪽 색은 왼발, 오른쪽 색은 오른발':'화면 색 칸으로 점프');
      let lvl=-1, nextAt=0, prev=[];
      function paint(el,c){
        el.style.background=COLORS[c].css; el.style.color=COLORS[c].text;
        
        const mini=el.querySelector('.bs-mini'); if(mini) [...mini.children].forEach((i,p)=>i.className=MAT[p]===c?'on':'');
        el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      }
      function blank(){ halves.forEach(el=>{ el.style.background='#000'; }); }
      function show(){
        let cs;
        for(let n=0;n<40;n++){
          cs=two?[rnd(4),rnd(4)]:[rnd(4)];
          if(two && cs[0]===cs[1]) continue;
          if(cs.some((c,i)=>c===prev[i])) continue; // 같은 자리에 같은 색이 연달아 나오지 않게
          break;
        }
        prev=cs; cs.forEach((c,i)=>paint(halves[i],c)); api.tick(); api.jump(cs.length);
      }
      return {
        bpmAt:t=>100+lvAt(t)*8, intensityAt:t=>lvAt(t)+1,
        begin(){ lvl=-1; blank(); },
        update(T){
          if(T>=TOTAL){ api.unit(); return api.finish('잘 뛰었어요!',`${NL}단계를 모두 마쳤어요!`); }
          const li=lvAt(T);
          if(li!==lvl){ if(lvl>=0) api.unit(); lvl=li; api.hud(`${li+1}단계`,'/ '+NL); if(li>0){ api.banner(`${li+1}단계`,li===NL-1?'마지막 단계! 최고 속도로!':'조금 더 빨라져요',COLORS[MAT[li%4]].css); api.chime(); } }
          const t=T-li*LS;
          if(li>0 && t<BN){ nextAt=li*LS+BN; }
          else { api.hideBanner(); if(T>=nextAt){ show(); nextAt=T+GAPS[li]*(two?1.2:1); } }
          api.right(fmt(TOTAL-T)); api.progress(li,t/LS);
        },
        skip(d){ const i=lvl+d; if(i>=NL) return api.finish('잘 뛰었어요!',`${NL}단계를 모두 마쳤어요!`); api.setT(Math.max(0,i)*LS); nextAt=0; },
        destroy(){ $('mgPlay').classList.remove('fullbleed'); }
      };
    }
  };

  // ================= 게임 9: 용암 매트 =================
  const LAVA={
    id:'lava', name:'용암 매트', grade:'전 학년', dur:'4분', lit:[1,2],
    desc:'용암으로 변한 칸은 밟으면 안 돼요! 안전한 칸에서 계속 콩콩 뛰다가, 용암이 바뀌면 재빨리 옮겨요.',
    how:['멈추지 말고 안전한 칸 위에서 계속 콩콩 뛰어요.','1~4단계는 매트 그림에 용암이 보여요. 5단계부터는 그림 없이 "용암: 빨강"처럼 글자만 나오고, 7단계부터는 글자 색도 사라져요.','용암은 1~2칸이라 안전한 칸이 늘 2~3개예요. 남은 칸만 보고 뛸 수 없어서 스스로 판단해야 해요.'],
    options:[
      {id:'diff',label:'용암이 바뀌는 빠르기',choices:[['easy','천천히 (5초→3초)'],['normal','보통 (4초→2.2초)'],['hard','빠르게 (3.2초→1.6초)']],def:'normal'},
    ],
    create(o,api){
      const GAPS={easy:[5,4.6,4.2,4.4,4,3.6,3.4,3],normal:[4,3.6,3.2,3.4,3,2.6,2.5,2.2],hard:[3.2,2.8,2.5,2.7,2.3,2,1.8,1.6]}[o.diff];
      // 단계별: 용암 칸 수(0 = 1~2칸 무작위), 매트 그림, 글자 색
      const STAGE=[{n:1,map:1,ink:1},{n:1,map:1,ink:1},{n:2,map:1,ink:1},{n:2,map:1,ink:1},
                   {n:0,map:0,ink:1},{n:0,map:0,ink:1},{n:2,map:0,ink:0},{n:2,map:0,ink:0}];
      const COUNT=STAGE.map(x=>x.n||2), LS=30, NL=8, BN=2.5, TOTAL=NL*LS, WARN=0.7, lvAt=t=>Math.min(NL-1,Math.floor(t/LS));
      api.body.className='s-lava';
      api.body.innerHTML='<div class="lv-title"></div>';
      const title=api.body.querySelector('.lv-title'), mat=makeMat('lv-mat'); api.body.appendChild(mat.el);
      const note=document.createElement('div'); note.className='lv-note'; api.body.appendChild(note);
      api.segments(NL); api.chip('안전한 칸에서 계속 콩콩!');
      let lvl=-1, nextAt=0, lava=[], warned=false;
      function sizzle(){ if(!soundOn||!ac||ac.state!=='running') return; const t=ac.currentTime; noise(t,0.35,0.25,'highpass',2500); tone(90,t,0.3,0.25,'sawtooth',300); }
      function draw(){
        mat.cells.forEach(cell=>{ const c=+cell.dataset.c, hot=lava.includes(c);
          cell.className=hot?'lava':'safe'; const b=cell.querySelector('b'); b.hidden=false;
          b.textContent=hot?`${COLORS[c].short} 용암`:'안전'; });
        const st=STAGE[lvl];
        title.innerHTML='용암: '+lava.map(c=>`<span style="color:${st.ink?COLORS[c].css:'var(--ink)'}">${COLORS[c].short}</span>`).join(' · ');
        mat.el.hidden=!st.map; api.body.classList.toggle('nomap',!st.map);
        note.textContent=!st.map?'매트 그림이 없어요! 글자를 보고 피해요':lava.length===2?'안전한 두 칸 사이를 오가며 콩콩!':'용암만 피해서 콩콩!';
      }
      function change(){
        const n=STAGE[lvl].n||(1+rnd(2)); let next;
        for(let k=0;k<40;k++){ next=shuffle([0,1,2,3]).slice(0,n).sort(); if(next.join()!==lava.join()) break; }
        lava=next; draw(); api.pop(mat.el); sizzle(); mat.el.classList.remove('warn'); warned=false; api.jump();
      }
      return {
        bpmAt:t=>104+lvAt(t)*6, intensityAt:t=>lvAt(t)+1,
        readyNote:'매트 위에 올라가 준비!',
        begin(){ lvl=-1; lava=[]; },
        update(T){
          if(T>=TOTAL){ api.unit(); return api.finish('용암 탈출!',`${NL}단계를 모두 버텼어요. 다리 쭉 펴고 쉬어요!`); }
          const li=lvAt(T);
          if(li!==lvl){ if(lvl>=0) api.unit(); lvl=li; api.hud(`${li+1}단계`,'/ '+NL);
            if(li>0){ const a=STAGE[li-1], b=STAGE[li];
              const msg=a.map&&!b.map?'이제 매트 그림 없이 글자만 나와요!':a.ink&&!b.ink?'글자 색도 사라져요! 글자만 읽고 피해요':(b.n===2&&a.n===1)?'용암이 2칸으로 늘어나요!':'용암이 더 빨리 바뀌어요';
              api.banner(`${li+1}단계`,msg,'#FF7A1A'); api.chime(); } }
          const t=T-li*LS;
          if(li>0 && t<BN){ nextAt=li*LS+BN; }
          else {
            api.hideBanner();
            if(!warned && lava.length && T>=nextAt-WARN){ warned=true; mat.el.classList.add('warn'); api.beep(620,0.12,0.14,'square'); }
            if(T>=nextAt){ change(); nextAt=T+GAPS[li]; }
          }
          api.right(fmt(TOTAL-T)); api.progress(li,t/LS);
        },
        skip(d){ const i=lvl+d; if(i>=NL) return api.finish('용암 탈출!',`${NL}단계를 모두 버텼어요.`); api.setT(Math.max(0,i)*LS); nextAt=0; }
      };
    }
  };

  const GAMES=[BASIC,STROOP,MEMORY,RHYTHM,DIRGAME,QUIZ,ASSOC,TWIST,FREEZE,LAVA];
  // 기록에 적을 난이도 이름
  const LEVEL_KEY={basic:'diff',stroop:'mode',memory:'diff',rhythm:'diff',dir:'diff',quiz:'set',assoc:'diff',twist:'diff',freeze:'diff',lava:'diff'};
  GAMES.forEach(g=>{ g.levelOf=o=>{ if(g.id==='assoc'&&o.src==='mine') return '우리 반 그림'; const op=g.options.find(x=>x.id===LEVEL_KEY[g.id]); if(!op) return ''; const c=op.choices.find(c=>String(c[0])===String(o[op.id])); let s=c?c[1].replace(/\s*\(.*$/,''):''; if(g.id==='quiz'&&o.mlevel&&/add|times|muldiv/.test(o.set)) s+=' '+['','쉬움','보통','어려움'][+o.mlevel]; if(g.id==='stroop'&&o.easy==='on') s+=' · 이지'; return s; }; });
  const SOUND_OPT={id:'snd',label:'소리',choices:[['music','음악 + 효과음'],['fx','효과음만'],['off','끄기']],def:'music'};
  // 게임별 배경 음악 선택지 — 리듬 스텝은 박자를 맞춰야 해서 기본 음악만, 퀴즈·트위스터는 잔잔한 음악이 기본
  function musicOpts(g){
    const calm=g.id==='quiz'||g.id==='twist';
    const base=calm?[['calm','잔잔한 기본 음악']]:[['dance','신나는 댄스'],['march','행진곡'],['kids','동요풍'],['electro','전자음'],['random','매번 랜덤']];
    const choices=g.id==='rhythm'?base:base.concat([['mine','내 음악 파일'],['yt','유튜브 링크']]);
    return [
      {id:'bgm',label:'배경 음악',choices,def:base[0][0],showIf:['snd','music'],
       help:g.id==='rhythm'?'리듬 스텝은 블록이 박자에 맞게 떨어져야 해서 기본 음악만 쓸 수 있어요.':''},
      {id:'tracks',type:'tracks',label:'내 음악 파일',showIf:['bgm','mine']},
      {id:'yt',type:'yt',label:'유튜브 링크',showIf:['bgm','yt']},
    ];
  }
  const allOpts=g=>[...g.options,SOUND_OPT,...musicOpts(g)];

  // ================= 화면: 설정 (게임 목록은 앱 화면이 담당) =================
  const store={ get(k){ try{ return JSON.parse(localStorage.getItem('matpg:'+k)||'null'); }catch(e){ return null; } },
                set(k,v){ try{ localStorage.setItem('matpg:'+k,JSON.stringify(v)); }catch(e){} } };
  let cur=null;
  function openSetup(g){
    cur=g; hideAll(); $('mgSetup').hidden=false; $('mgSetup').scrollTop=0; $('mgSErr').hidden=true;
    $('mgSTitle').textContent=g.name; $('mgSDesc').textContent=g.desc;
    $('mgSHow').innerHTML=g.how.map(h=>`<li>${h}</li>`).join('');
    const saved=store.get(g.id)||{}, hide=H.hooks.hideOptions||[];
    const opts=allOpts(g).filter(op=>!hide.includes(op.id));
    $('mgSOpts').innerHTML=opts.map(op=>{
      const id=`${g.id}-${op.id}`;
      if(op.type==='tracks') return `<fieldset style="flex-basis:100%" data-show="bgm=mine"><legend>${op.label}</legend>
        <div class="tracks" id="trackList"></div>
        <label class="addbtn">+ 음악 파일 추가<input type="file" id="trackInput" accept=".mp3,.m4a,.wav,.ogg,.aac,.flac,audio/mpeg,audio/mp4,audio/x-m4a,audio/wav,audio/ogg,audio/aac,audio/flac" multiple hidden></label>
        <p class="fhelp">MP3 같은 음악 파일을 여러 개 넣으면 섞어서 차례로 나와요. 이 기기의 브라우저에 저장돼서 다음에도 그대로 있고, 모든 게임에서 함께 써요. 단계가 오를수록 조금씩 빨라져요(최대 1.3배).</p></fieldset>`;
      if(op.type==='yt') return `<fieldset style="flex-basis:100%" data-show="bgm=yt"><legend>${op.label}</legend>
        <textarea id="ytInput" placeholder="www.youtube.com/watch?v=...&#10;youtu.be/...&#10;재생목록 주소(list=...)도 돼요">${esc(store.get('yt')||'')}</textarea>
        <p class="fhelp">유튜브 영상이나 재생목록 주소를 한 줄에 하나씩 넣어요. 여러 개면 섞어서 차례로 나오고, 모든 게임에서 함께 써요.<br>인터넷이 필요하고 화면 왼쪽 아래에 작은 플레이어가 나와요. 소리가 안 나면 플레이어의 ▶를 한 번 눌러 주세요. 오프라인판처럼 파일로 연 화면에서는 유튜브가 재생을 막으니(오류 153) 그때는 "내 음악 파일"을 쓰세요. 광고가 붙거나 "다른 사이트 재생 금지"인 영상은 건너뛰어요.</p></fieldset>`;
      if(op.type==='textarea') return `<fieldset style="flex-basis:100%" data-show="${op.showIf?op.showIf.join('='):''}"><legend>${op.label}</legend>
        <textarea id="${id}" placeholder="${esc(op.placeholder||'')}">${esc(saved[op.id]||'')}</textarea><p class="fhelp">${op.help||''}</p></fieldset>`;
      let choices=op.choicesFn?op.choicesFn():op.choices;
      if(op.id==='set' && !H.bank.length) choices=choices.filter(c=>c[0]!=='bank');
      if(op.id==='set' && hide.includes('custom')) choices=choices.filter(c=>c[0]!=='custom');
      let val=saved[op.id]??op.def??choices[0][0]; if(!choices.some(c=>String(c[0])===String(val))) val=op.def??choices[0][0];
      return `<fieldset data-show="${op.showIf?op.showIf.join('='):''}"><legend>${op.label}</legend><div class="seg">${choices.map(([v,l])=>
        `<label><input type="radio" name="${id}" id="${id}-${v}" value="${v}" ${String(v)===String(val)?'checked':''}><span>${l}</span></label>`).join('')}</div>${op.help?`<p class="fhelp">${op.help}</p>`:''}${op.helpFn?`<p class="fhelp" data-helpfn="${op.id}"></p>`:''}</fieldset>`;
    }).join('');
    syncShow(); renderTracks();
    const ti=$('trackInput'); if(ti) ti.addEventListener('change',async e=>{ for(const f of e.target.files) await TrackDB.add(f); e.target.value=''; $('mgSErr').hidden=true; renderTracks(); });
  }
  async function renderTracks(){
    const box=$('trackList'); if(!box) return;
    const list=await TrackDB.all();
    box.innerHTML=list.length?list.map(t=>`<div class="track"><span>${esc(t.name)}</span><button type="button" data-del="${t.id}" aria-label="${esc(t.name)} 빼기">빼기</button></div>`).join('')
      :'<p class="fhelp" style="margin:0">아직 넣은 음악이 없어요.</p>';
  }
  $('mgSOpts').addEventListener('click',async e=>{ const b=e.target.closest('[data-del]'); if(!b) return;
    const id=/^\d+$/.test(b.dataset.del)?+b.dataset.del:b.dataset.del; await TrackDB.del(id); renderTracks(); });
  function readOpts(){
    const o={}, hide=H.hooks.hideOptions||[];
    allOpts(cur).forEach(op=>{ const id=`${cur.id}-${op.id}`;
      if(op.type==='tracks'||op.type==='yt') return;
      if(hide.includes(op.id)){ o[op.id]=op.def??(op.choices?op.choices[0][0]:''); return; }
      if(op.type==='textarea') o[op.id]=$(id).value;
      else o[op.id]=(document.querySelector(`input[name="${id}"]:checked`)||{}).value; });
    return o;
  }
  function syncShow(){
    const o=readOpts();
    $('mgSOpts').querySelectorAll('[data-helpfn]').forEach(el=>{ const op=cur.options.find(x=>x.id===el.dataset.helpfn); el.innerHTML=op.helpFn(o); });
    $('mgSOpts').querySelectorAll('[data-show]').forEach(fs=>{ const s=fs.dataset.show; if(!s) return; const [k,v]=s.split('='); fs.hidden=!v.split('|').includes(o[k]) || (k==='bgm' && o.snd!=='music'); });
  }
  $('mgSOpts').addEventListener('change',syncShow);
  async function start(){
    const o=readOpts(); let err=cur.validate?cur.validate(o):'';
    if(!err && H.hooks.validate){ try{ err=H.hooks.validate(o)||''; }catch(e){ err=e.message; } }
    if(!err && o.snd==='music' && o.bgm==='mine'){
      const list=await TrackDB.all();
      if(!list.length) err='"내 음악 파일"을 고르셨어요. 음악 파일을 한 개 이상 추가해 주세요.';
      else player.load(list);
    }
    if(!err && o.snd==='music' && o.bgm==='yt'){
      const txt=$('ytInput').value; store.set('yt',txt); const cfg=yt.parse(txt);
      if(!cfg.ids.length && !cfg.list) err='"유튜브 링크"를 고르셨어요. 유튜브 영상이나 재생목록 주소를 한 줄 이상 넣어 주세요.';
      else yt.cfg=cfg;
    }
    if(err){ $('mgSErr').textContent=err; $('mgSErr').hidden=false; return; }
    $('mgSErr').hidden=true;
    store.set(cur.id,o); startGame(cur,o);
  }
  $('mgStartBtn').onclick=start;
  $('mgBackBtn').onclick=toHub;
  $('mgAgainBtn').onclick=()=>{ if(H.hooks.onAgain){ try{ if(H.hooks.onAgain()===false) return; }catch(e){} } startGame(E.def,E.opts); };
  $('mgHubBtn').onclick=toHub;
  $('mgExitBtn').onclick=()=>{ if(E.running && H.hooks.confirmExit && !confirm(H.hooks.confirmExit)) return; toHub(); };
  $('mgPauseBtn').onclick=togglePause;
  $('mgPrevBtn').onclick=()=>skip(-1);
  $('mgNextBtn').onclick=()=>skip(1);
  $('mgFsBtn').onclick=goFull;
  $('mgPeerBtn').onclick=()=>settlePeer(true);

  document.addEventListener('keydown',e=>{
    if(OV.classList.contains('hide')) return;
    if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
    if($('mgPlay').hidden){
      if(e.key==='Escape' && !$('mgSetup').hidden) toHub();
      return;
    }
    if(e.code==='Space'){ e.preventDefault(); if(E.pending) settlePeer(true); else togglePause(); }
    else if(e.key==='Enter'){ if(E.pending){ e.preventDefault(); settlePeer(true); } }
    else if(e.key==='ArrowRight') skip(1);
    else if(e.key==='ArrowLeft') skip(-1);
    else if(e.key==='f'||e.key==='F') goFull();
    else if(e.key==='Escape') $('mgExitBtn').click();
  });
  let hideT=0;
  OV.addEventListener('pointermove',()=>{ OV.classList.add('show-ctrls'); clearTimeout(hideT);
    hideT=setTimeout(()=>OV.classList.remove('show-ctrls'),2200); });
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && E.running) keepAwake(); });
  // 창을 닫거나 새로고침하면 진행한 만큼 저장하도록 알립니다
  window.addEventListener('beforeunload',()=>{ if(E.running){ closeUnit(true); const s=summary(false); if(H.hooks.onEnd) try{ H.hooks.onEnd(s); }catch(e){} } });

  /* ---------- 앱에서 쓰는 열기/닫기 ---------- */
  function open(gameId, hooks){
    const g=GAMES.find(x=>x.id===gameId); if(!g) throw new Error('게임을 찾지 못했어요: '+gameId);
    H.hooks=hooks||{};
    OV.classList.remove('hide'); document.body.classList.add('mg-open');
    openSetup(g);
    const ex=$('mgExtra'); ex.innerHTML=H.hooks.extraHTML||''; ex.hidden=!H.hooks.extraHTML;
    if(H.hooks.onOpen) try{ H.hooks.onOpen(ex); }catch(e){ console.error(e); }
  }
  function setPeer(on, name){ H.hooks.peer=!!on; H.hooks.peerName=name||''; }
  function doneHTML(html){ $('mgDoneExtra').innerHTML=html||''; }
  function list(){ return GAMES.map(g=>({id:g.id,name:g.name,grade:g.grade,dur:g.dur,desc:g.desc,how:g.how,lit:g.lit,featured:!!g.featured})); }
  const glyph=g=>`<span class="mat4 glyph mg-glyph" aria-hidden="true">${MAT.map(c=>`<i style="--c:${COLORS[c].hex}" class="${g.lit.includes(c)?'':'off'}"></i>`).join('')}</span>`;
  window.MATGAME={ open, close:toHub, setPeer, doneHTML, list, glyph:(id)=>{ const g=GAMES.find(x=>x.id===id); return g?glyph(g):''; },
    setBank:(rows)=>{ H.bank=Array.isArray(rows)?rows:[]; }, setPics:(rows)=>{ H.pics=(Array.isArray(rows)?rows:[]).filter(p=>p&&p.src&&Array.isArray(p.cs)&&p.cs.length); }, picsCount:()=>H.pics.length, isOpen:()=>!OV.classList.contains('hide'), running:()=>E.running,
    COLORS, MAT, QGEN, PE_QUIZ, summary:()=>summary(false),
    _advance:(sec)=>{ if(E.running&&E.phase==='run'){ E.T+=sec; E.played+=sec; } } };   // 시험용: 게임 시간을 앞으로
})();

} catch (e) { window.MATGAME_ERROR = String((e && e.stack) || e); console.error('Mat_Game 로드 오류', e); }
</script>
