MODS.CLASS = MODS.CLASS || {};
MODS.CLASS.teacher = (function () {
  var D = null;              // { 설정, 교시, 시간표, 계획, 기록 }
  var pages = ['now', 'records', 'timetable', 'plans', 'print', 'teams', 'settings'];
  var nav = [
    { section: '수업 도우미' },

          '<div class="chks" style="margin-top:6px"><button class="mini ghost" id="clSHolFill"><i class="ti ti-calendar-plus"></i>법정 공휴일 채우기 (날짜가 고정된 것)</button><span class="unit">설·추석·석가탄신일·대체공휴일·재량휴업일은 직접 적어 주세요. 주말은 시간표에 없으니 적지 않아도 됩니다.</span></div></div>' +
        '<div class="note" style="margin-top:12px"><i class="ti ti-info-circle"></i><div>지금은 <b>' + esc(S.오늘 ? S.오늘.이름 : '') + '</b>' + (S.오늘 && S.오늘.상태 === '방학' && S.오늘.다음 ? ' · ' + S.오늘.다음.학기 + '학기 ' + md(S.오늘.다음.시작) + ' 시작' : '') + '입니다. 출석부·명렬표의 학기 표시도 이 날짜로 정해집니다.</div></div>' +
        '</div><div class="savebar"><span class="status" id="clSStatus3"></span><div class="spacer"></div><button id="clBtnSCal"><i class="ti ti-device-floppy"></i>학사일정 저장</button></div></div>' +
      '<div class="panel"><div class="panel-head"><h3><i class="ti ti-database"></i>자료</h3><span class="unit">학생 ' + roster().length + '명 · 수업 계획 ' + D.계획.length + '차시 · 수업 기록 ' + Object.keys(D.기록).length + '건</span></div><div class="panel-body">' +
        '<div class="note"><i class="ti ti-info-circle"></i><div>모든 내용은 스프레드시트의 <b>수업_교시 · 수업_시간표 · 수업_계획 · 수업_기록 · 수업_출석</b> 시트에 저장됩니다. 따로 백업하지 않아도 되고, 기록을 지우려면 공통 <b>초기화</b> 화면에서 수업 도우미 항목을 고르세요.</div></div>' +
        '<div class="chks"><button class="ghost" data-go="reset"><i class="ti ti-trash"></i>초기화 화면으로</button></div></div></div>';
    $('clBtnSCal').onclick = function () {
      var map = { 학사: { 1: { 시작: $('clS1a').value, 끝: $('clS1b').value }, 2: { 시작: $('clS2a').value, 끝: $('clS2b').value } }, 쉬는날: $('clSHol').value.split('\n').join(';') };
      if (!map.학사[1].시작 || !map.학사[1].끝 || !map.학사[2].시작 || !map.학사[2].끝) { setStatus('clSStatus3', '학기 시작·끝 날짜를 모두 넣어 주세요.', 'err'); return; }
      setStatus('clSStatus3', '저장 중…');
      api('class_t_saveSettings', TOKEN, map).then(function (r) { D.설정 = r.설정; TT_SEM = null; setStatus('clSStatus3', '저장했습니다.', 'ok'); toast('학사일정을 저장했습니다.'); renderSettings(); }).catch(function (e) { setStatus('clSStatus3', (e && e.message) || String(e), 'err'); });
    };
    $('clSHolFill').onclick = function () {
      var y = Number(S.학년도) || new Date().getFullYear(), fixed = [[y, '03-01', '삼일절'], [y, '05-05', '어린이날'], [y, '06-06', '현충일'], [y, '08-15', '광복절'], [y, '10-03', '개천절'], [y, '10-09', '한글날'], [y, '12-25', '성탄절'], [y + 1, '01-01', '신정']];
      var ta = $('clSHol'), have = ta.value.split('\n').map(function (l) { return l.trim().split(/\s+/)[0]; });
      var add = fixed.map(function (f) { return f[0] + '-' + f[1] + ' ' + f[2]; }).filter(function (l) { return have.indexOf(l.split(' ')[0]) < 0; });
      ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + add.join('\n');
      toast(add.length ? add.length + '일을 추가했습니다. 저장을 눌러 주세요.' : '이미 다 들어 있습니다.');
    };
    $('clBtnSSave').onclick = function () {
      var map = { 장소: $('clSPlaces').value.split(',').map(function (x) { return x.trim(); }).filter(Boolean), 태그: $('clSTags').value.split(',').map(function (x) { return x.trim(); }).filter(Boolean) };
      setStatus('clSStatus2', '저장 중…');
      api('class_t_saveSettings', TOKEN, map).then(function (r) { D.설정 = r.설정; setStatus('clSStatus2', '저장했습니다.', 'ok'); toast('저장했습니다.'); }).catch(handleErr);
    };
  }

  return { nav: nav, init: init, show: show, reset: reset };
})();
</script>
