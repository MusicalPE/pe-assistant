<!-- 색깔 매트 놀이터 · 학생 화면 (모듈 MAT, 역할 S). 게임 자체는 Mat_Game.html 의 오버레이에서 돌아갑니다 -->
<style>
#mat_S .chks{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
#mat_S .chk.sm{padding:6px 10px;font-size:13.5px;border-radius:9px;}
#mat_S .seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;overflow-x:auto;max-width:100%;}
#mat_S button.seg-b{background:transparent;border:0;color:var(--ink-2);padding:5px 11px;font-size:12.5px;border-radius:7px;white-space:nowrap;flex:none;box-shadow:none;}
#mat_S button.seg-b:hover{background:#fff;color:var(--ink);}
#mat_S button.seg-b.on{background:#fff;color:var(--accent-ink);box-shadow:0 1px 3px rgba(22,35,46,.12);}
#mat_S kbd{font-family:inherit;background:var(--soft);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 6px;font-size:12px;}
#mat_S .gcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
@media (max-width:900px){#mat_S .gcards{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:480px){#mat_S .gcards{grid-template-columns:1fr;}}
#mat_S button.gcard{flex-direction:column;align-items:stretch;gap:8px;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;min-height:150px;box-shadow:var(--shadow);}
#mat_S button.gcard:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);}
#mat_S .gcard .top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
#mat_S .gcard h4{margin:0;font-size:18px;font-weight:800;letter-spacing:-.03em;}
#mat_S .gcard p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.5;font-weight:500;flex:1;}
#mat_S .gcard .meta{display:flex;gap:6px;flex-wrap:wrap;}
#mat_S .gcard .meta span{font-size:11.5px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:99px;padding:2px 8px;}
#mat_S .gcard .cnt{font-size:11.5px;color:var(--accent-ink);font-weight:700;}
#mat_S button.gcard.feat{position:relative;border-color:var(--accent);background:var(--accent-soft);}
#mat_S .gcard.feat .ftag{position:absolute;top:-10px;left:14px;background:var(--sun,#f5c542);color:#15130a;font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 10px;}
#mat_S .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
#mat_S .side{border-radius:14px;padding:14px 16px;}
#mat_S .side.p{background:#FFF1E6;} #mat_S .side.s{background:var(--soft);}
#mat_S .side b.t{display:block;font-size:13px;color:var(--ink-3);margin-bottom:6px;}
#mat_S .side .v{font-size:26px;font-weight:800;letter-spacing:-.04em;}
#mat_S .side .v small{font-size:13px;color:var(--ink-3);font-weight:600;margin-left:3px;}
#mat_S .side .d{font-size:12.5px;color:var(--ink-2);margin-top:4px;}
#mat_S .rec{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;flex-wrap:wrap;}
#mat_S .rec:last-child{border-bottom:none;}
#mat_S .rec .t{color:var(--ink-3);font-size:12.5px;width:82px;}
#mat_S .rec .g{font-weight:800;min-width:90px;}
#mat_S .rec .n{color:var(--ink-2);}
#mat_S .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
#mat_S .bd{border:1.5px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;background:#fff;}
#mat_S .bd i{font-size:26px;color:var(--ink-3);display:block;margin-bottom:4px;}
#mat_S .bd b{display:block;font-size:13px;letter-spacing:-.02em;}
#mat_S .bd small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;}
#mat_S .bd .prog{margin-top:6px;height:5px;}
#mat_S .bd.on{border-color:var(--accent);background:var(--accent-soft);}
#mat_S .bd.on i{color:var(--accent);}
#mat_S .q{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;align-items:flex-start;}
#mat_S .q:last-child{border-bottom:none;}
@media (max-width:640px){ #mat_S .two{grid-template-columns:1fr;} }
</style>

<div class="mroot hide" data-mod="MAT" data-role="S" id="mat_S">
  <!-- ===== 게임 고르기 ===== -->
  <div class="page" id="mat_sp_games">
    <div class="page-head"><h2>색깔 매트 놀이터</h2><span class="sub">바닥의 4색 매트로 하는 체육 게임이에요. 매트는 왼쪽 위 빨강, 오른쪽 위 노랑, 왼쪽 아래 초록, 오른쪽 아래 파랑으로 놓아요.</span></div>
    <div class="kpis" id="msKpis"></div>
    <div class="note" id="msPeerNote"><i class="ti ti-users"></i><div><b>짝과 함께</b>하면 단계가 끝날 때마다 짝이 "뛰고 있어요!"를 눌러 줘요(함께 기록). <b>혼자 연습</b>도 기록에 남아요(연습 기록). 둘 다 내 노력이에요!</div></div>
    <div class="gcards" id="msCards"></div>
  </div>
  <!-- ===== 내 기록 ===== -->
  <div class="page hide" id="mat_sp_records">
    <div class="page-head"><h2>내 매트 기록</h2><span class="sub" id="msRecSub"></span></div>
    <div class="two" style="margin-bottom:14px">
      <div class="side p"><b class="t"><i class="ti ti-users"></i> 함께 뛴 기록</b><div class="v" id="msPTime"></div><div class="d" id="msPDesc"></div></div>
      <div class="side s"><b class="t"><i class="ti ti-user"></i> 내 연습 기록</b><div class="v" id="msSTime"></div><div class="d" id="msSDesc"></div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3><i class="ti ti-award"></i>내 배지</h3><span class="unit" id="msBadgeSub"></span></div>
      <div class="panel-body"><div class="badges" id="msBadges"></div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3><i class="ti ti-history"></i>최근 플레이</h3></div>
      <div class="panel-body" id="msRecent" style="padding-top:4px"></div>
    </div>
  </div>
  <!-- ===== 문제 내기 ===== -->
  <div class="page hide" id="mat_sp_propose">
    <div class="page-head"><h2>퀴즈 문제 내기</h2><span class="sub">퀴즈 점프에 나올 문제를 낼 수 있어요. 선생님이 확인하면 문제 은행에 들어가요.</span></div>
    <div class="panel">
      <div class="panel-body">
        <div class="field" style="margin-bottom:10px"><label>문제</label><input type="text" id="msQ" maxlength="120" placeholder="예: 농구에서 한 팀은 몇 명이 경기해요?"></div>
        <div class="grid g2" style="margin-bottom:10px"><div class="field"><label>정답</label><input type="text" id="msA" maxlength="40" placeholder="5명"></div><div class="field"><label>오답 1</label><input type="text" id="msW1" maxlength="40" placeholder="4명"></div></div>
        <div class="grid g2" style="margin-bottom:10px"><div class="field"><label>오답 2</label><input type="text" id="msW2" maxlength="40" placeholder="6명"></div><div class="field"><label>오답 3 (선택)</label><input type="text" id="msW3" maxlength="40" placeholder="7명"></div></div>
        <div class="grid g2" style="margin-bottom:10px"><div class="field"><label>교과</label><select id="msSubj"><option>체육</option><option>국어</option><option>수학</option><option>사회</option><option>과학</option><option>영어</option><option>도덕</option><option>기타</option></select></div><div class="field"><label>한 줄 설명 (선택)</label><input type="text" id="msE" maxlength="120" placeholder="정답이 나올 때 함께 보여 줄 설명"></div></div>
        <div class="savebar"><span class="status" id="msQStatus"></span><div class="spacer"></div><button id="msQSend"><i class="ti ti-send"></i>선생님께 보내기</button></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3><i class="ti ti-list-check"></i>내가 낸 문제</h3></div>
      <div class="panel-body" id="msMyQ" style="padding-top:4px"></div>
    </div>
  </div>
</div>

<script>
/* 색깔 매트 놀이터 · 학생 — MODS.MAT.student */
MODS.MAT = MODS.MAT || {};
MODS.MAT.student = (function () {
  var D = null, LOADING = false;
  var pages = ['games', 'records', 'propose'];
  var nav = [
    { section: '색깔 매트 놀이터' },
    { id: 'games', label: '게임 하기', icon: 'layout-grid' },
    { id: 'records', label: '내 매트 기록', icon: 'chart-bar' },
    { id: 'propose', label: '퀴즈 문제 내기', icon: 'bulb' }
  ];
  var ROOT = $('mat_S');
  var G = { id: null, mode: '연습', peer: null, player: null, recId: null, startedAt: null, saving: false, lastSum: null, badgesBefore: [] };
  function qa(sel, root) { return Array.prototype.slice.call((root || ROOT).querySelectorAll(sel)); }

  function init(ctx) { D = null; load(); }
  function reset() { D = null; if (window.MATGAME && MATGAME.isOpen()) MATGAME.close(); }
  function load(then) {
    if (LOADING) return; LOADING = true;
    api('mat_s_boot', TOKEN).then(function (d) { LOADING = false; D = d; if (window.MATGAME) MATGAME.setBank(d.문제 || []); if (then) then(); }).catch(function (e) { LOADING = false; handleErr(e); });
  }
  function show(p) {
    pages.forEach(function (id) { $('mat_sp_' + id).classList.toggle('hide', id !== p); });
    var fn = { games: renderGames, records: renderRecords, propose: renderPropose }[p];
    if (!fn) return;
    if (!D) { load(fn); return; }
    fn();
    if (p === 'games') load(renderGames);   // 게임 화면에 올 때마다 새로 받아 옴 (선생님이 방금 승인한 문제·짝 배정 반영)
  }
  function 시간표시(초) { 초 = Math.round(초 || 0); var m = Math.floor(초 / 60), s = 초 % 60; if (m >= 60) return Math.floor(m / 60) + '시간 ' + (m % 60) + '분'; return m ? m + '분' + (s ? ' ' + s + '초' : '') : s + '초'; }
  function gname(id) { var g = findOne(D.게임이름, function (x) { return x[0] === id; }); return g ? g[1] : id; }
  function 조사(name, pair) { var t = String(name || ''), c = t.charCodeAt(t.length - 1); var 받침 = (c >= 0xAC00 && c <= 0xD7A3) ? ((c - 0xAC00) % 28) > 0 : false; return t + (받침 ? pair.charAt(0) : pair.charAt(1)); }

  /* ================= 게임 고르기 ================= */
  function renderGames() {
    var y = D.요약, list = window.MATGAME ? MATGAME.list() : [];
    $('msKpis').innerHTML = kpiTile('총 운동 시간', 시간표시(y.총시간), '', 'clock', 'brand') + kpiTile('함께 뛴 시간', 시간표시(y.함께.시간), '', 'users', 'coral') +
      kpiTile('연습 시간', 시간표시(y.연습.시간), '', 'user', 'violet') + kpiTile('받은 배지', y.배지수, '개', 'award', 'sun');
    var on = D.설정.게임;
    var 그림수 = (D.그림 || []).length;
    $('msCards').innerHTML = list.filter(function (g) { return on.indexOf(g.id) >= 0; }).map(function (g) {
      var n = y.게임별[g.id] || 0;
      return '<button class="gcard' + (g.featured ? ' feat' : '') + '" data-game="' + g.id + '">' + (g.featured ? '<span class="ftag">처음이라면 여기부터</span>' : '') + '<div class="top"><h4>' + esc(g.name) + '</h4>' + MATGAME.glyph(g.id) + '</div><p>' + esc(g.desc) + '</p>' +
        '<div class="meta"><span>' + esc(g.grade) + '</span><span>' + esc(g.dur) + '</span>' + (g.id === 'assoc' && 그림수 ? '<span>우리 반 그림 ' + 그림수 + '장</span>' : '') + (n ? '<span class="cnt">' + n + '번 했어요</span>' : '') + '</div></button>';
    }).join('') || '<div class="empty"><i class="ti ti-layout-grid"></i><strong>지금은 할 수 있는 게임이 없어요</strong>선생님이 게임을 켜 주면 여기에 나와요.</div>';
    qa('[data-game]').forEach(function (b) { b.onclick = function () { openGame(b.getAttribute('data-game')); }; });
    $('msPeerNote').classList.toggle('hide', !list.length);
  }

  /* ---------- 게임 열기: 함께/연습 · 짝 고르기 ---------- */
  function extraHTML() {
    var s = D.설정, 배정 = D.짝;
    var peerBox = '';
    if (s.짝방식 === '교사') {
      peerBox = 배정 ? '<p class="hint">짝: <b style="color:var(--ink)">' + esc(배정.짝이름) + '</b> (선생님이 정해 줬어요) — 짝이 옆에서 화면을 보며 단계마다 "뛰고 있어요!"를 눌러 줘요.</p>'
                     : '<p class="hint">아직 선생님이 짝을 정해 주지 않았어요. 혼자 연습으로 해 봐요.</p>';
    } else {
      peerBox = '<p class="hint">같은 반 친구 중에서 짝을 골라요. 짝이 옆에서 화면을 보며 단계마다 "뛰고 있어요!"를 눌러 줘요.</p><div class="segbtns" id="mgPeerPick">' +
        D.반친구.map(function (f) { return '<button type="button" data-peer="' + f.학생ID + '"' + (G.peer && G.peer.학생ID === f.학생ID ? ' class="on"' : '') + '>' + f.번호 + ' ' + esc(f.이름) + '</button>'; }).join('') + '</div>' +
        (D.반친구.length ? '' : '<p class="hint">같은 반 친구가 명단에 없어요.</p>');
    }
    return '<div class="box"><b>어떻게 할까요?</b><div class="segbtns" id="mgModePick">' +
      '<button type="button" data-mode="함께"' + (G.mode === '함께' ? ' class="on"' : '') + '>👫 짝과 함께 (함께 기록)</button>' +
      '<button type="button" data-mode="연습"' + (G.mode === '연습' ? ' class="on"' : '') + '>🏃 혼자 연습 (연습 기록)</button></div>' +
      '<div id="mgPeerBox"' + (G.mode === '함께' ? '' : ' hidden') + '>' + peerBox + '</div></div>';
  }
  function bindExtra(ex) {
    qa('[data-mode]', ex).forEach(function (b) { b.onclick = function () {
      G.mode = b.getAttribute('data-mode'); qa('[data-mode]', ex).forEach(function (x) { x.classList.toggle('on', x === b); });
      var pb = ex.querySelector('#mgPeerBox'); if (pb) pb.hidden = G.mode !== '함께';
    }; });
    qa('[data-peer]', ex).forEach(function (b) { b.onclick = function () {
      var f = findOne(D.반친구, function (x) { return x.학생ID === b.getAttribute('data-peer'); });
      G.peer = f ? { 학생ID: f.학생ID, 이름: f.이름 } : null;
      qa('[data-peer]', ex).forEach(function (x) { x.classList.toggle('on', x === b); });
    }; });
  }
  /* 우리 반 그림(연상 점프): 게임을 열기 직전에 그림 데이터를 받아 엔진에 넣음 (이름·색은 boot 에, 그림은 따로) */
  function loadPics(then) {
    var meta = D.그림 || [];
    if (!meta.length) { MATGAME.setPics([]); then(); return; }
    toast('그림을 불러오는 중…');
    api('mat_s_getPics', TOKEN).then(function (data) {
      var names = MATGAME.COLORS.map(function (c) { return c.short; });
      MATGAME.setPics(meta.map(function (p) {
        return { id: p.id, name: p.이름, cs: (p.색 || []).map(function (n) { return names.indexOf(n); }).filter(function (i) { return i >= 0; }), src: (data || {})[p.파일ID] || '' };
      }));
      then();
    }).catch(function (e) { G.loadingPics = false; toast('그림을 불러오지 못했어요. ' + (e && e.message ? e.message : ''), 'warn'); });
  }
  function openGame(id) {
    if (id === 'assoc' && window.MATGAME && (D.그림 || []).length) { if (G.loadingPics) return; G.loadingPics = true; loadPics(function () { G.loadingPics = false; openGame2(id); }); return; }
    if (id === 'assoc' && window.MATGAME) MATGAME.setPics([]);
    openGame2(id);
  }
  function openGame2(id) {
    if (!window.MATGAME) { toast('게임 화면을 불러오지 못했어요. ' + (window.MATGAME_ERROR ? '(' + String(window.MATGAME_ERROR).split('\n')[0] + ')' : 'Mat_Game.html 파일이 빠졌거나 덜 붙여넣어졌는지 확인해 주세요.'), 'warn'); return; }
    G.id = id; G.player = null; G.lastSum = null;
    if (D.설정.짝방식 === '교사') G.peer = D.짝 ? { 학생ID: D.짝.짝ID, 이름: D.짝.짝이름 } : null;
    MATGAME.setBank(D.문제 || []);
    MATGAME.open(id, {
      extraHTML: extraHTML(), onOpen: bindExtra, hideOptions: ['custom'], noSkip: true,
      peerSec: D.설정.확인시간, confirmExit: '그만하면 지금까지 한 만큼만 기록돼요. 그만할까요?',
      validate: function () { if (G.mode === '함께' && !G.peer) return D.설정.짝방식 === '교사' ? '선생님이 짝을 정해 주지 않아서 아직 함께 할 수 없어요. 혼자 연습을 골라 주세요.' : '함께 뛸 짝을 골라 주세요.'; return ''; },
      onStart: onStart, onUnit: onUnit, onEnd: onEnd, onExit: function () { load(function () { if (CURRENT.mod === 'MAT') show(CURRENT.page); }); },
      onAgain: function () { G.player = null; return true; }
    });
  }
  /* 지금 뛰는 학생(역할 바꾸기 뒤에는 짝)과 확인하는 학생 */
  function who() {
    var me = { 학생ID: CTX.학생.학생ID, 이름: CTX.학생.이름 };
    if (G.mode !== '함께' || !G.peer) return { player: me, peer: null };
    if (G.player && G.player.학생ID !== me.학생ID) return { player: G.peer, peer: me };
    return { player: me, peer: G.peer };
  }
  function onStart(sum) {
    var w = who();
    G.recId = 'M' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    G.startedAt = nowStr(); G.badgesBefore = (D.요약.배지 || []).filter(function (b) { return b.달성; }).map(function (b) { return b.id; });
    MATGAME.setPeer(G.mode === '함께' && !!w.peer, w.peer ? w.peer.이름 : '');
    save(sum, '진행 중');
  }
  function onUnit(u, sum) { save(sum, '진행 중'); }
  function onEnd(sum) {
    G.lastSum = sum;
    var w = who(), peer = G.mode === '함께' && !!w.peer;
    MATGAME.doneHTML(doneStats(sum, peer, w) + '<div class="save">저장하는 중…</div>');
    save(sum, sum.done ? '완주' : '중간 종료', function (r) {
      if (!r) { MATGAME.doneHTML(doneStats(sum, peer, w) + '<div class="save err">기록을 저장하지 못했어요. 인터넷을 확인하고 선생님께 말해 주세요.</div>'); return; }
      var y = r.요약, html = doneStats(sum, peer, w);
      if (w.player.학생ID === CTX.학생.학생ID) { D.요약 = y; }
      var short = sum.credited < D.설정.최소시간;
      html += '<div class="stats"><div class="stat"><div class="l">' + esc(w.player.이름) + '의 함께 누적</div><div class="v">' + esc(시간표시(y.함께.시간)) + '</div></div>' +
        '<div class="stat"><div class="l">연습 누적</div><div class="v">' + esc(시간표시(y.연습.시간)) + '</div></div><div class="stat"><div class="l">총 운동 시간</div><div class="v">' + esc(시간표시(y.총시간)) + '</div></div></div>';
      if (short) html += '<p class="msg">' + D.설정.최소시간 + '초보다 짧아서 이번 판은 누적에 들어가지 않았어요. 다음엔 조금 더 길게!</p>';
      if (r.새배지 && r.새배지.length) html += '<div class="badges">' + r.새배지.map(function (b) { return '<span>🏅 ' + esc(b.이름) + '</span>'; }).join('') + '</div>';
      if (peer) html += '<div class="swap">이제 역할을 바꿔요!</div><p class="msg">' + esc(조사(w.peer.이름, '이가')) + ' 뛰고 ' + esc(조사(w.player.이름, '이가')) + ' 확인해 줘요. 아래 <b>한 번 더</b>를 누르면 같은 게임으로 이어서 해요.</p>';
      html += '<div class="save">기록했어요 ✓</div>';
      MATGAME.doneHTML(html);
      if (peer) { G.player = w.peer; }
      if (r.새배지 && r.새배지.length && w.player.학생ID === CTX.학생.학생ID) celebrate(r.새배지[0].이름);
    });
  }
  function doneStats(sum, peer, w) {
    return '<div class="stats">' +
      '<div class="stat"><div class="l">' + (peer ? '인정 시간' : '뛴 시간') + '</div><div class="v">' + esc(시간표시(sum.credited)) + '</div></div>' +
      '<div class="stat"><div class="l">' + (sum.game === 'twist' ? '버틴 자세' : '점프') + '</div><div class="v">' + sum.creditedJumps + '<small>회</small></div></div>' +
      (peer ? '<div class="stat"><div class="l">짝이 확인한 단계</div><div class="v">' + sum.confirmedUnits + '<small>/ ' + sum.units + '</small></div></div>' : '') +
      '<div class="stat"><div class="l">' + (sum.done ? '완주' : '중간 종료') + '</div><div class="v">' + esc(w.player.이름) + '</div></div></div>';
  }
  function save(sum, 완주, then) {
    var w = who(), peer = G.mode === '함께' && !!w.peer;
    var rec = { id: G.recId, 구분: peer ? '함께' : '연습', 짝ID: peer ? w.peer.학생ID : '', 플레이어ID: w.player.학생ID, 게임: sum.game, 난이도: sum.level,
                시작: G.startedAt, 끝: nowStr(), 진행시간: sum.played, 인정시간: sum.credited, 점프: sum.jumps, 인정점프: sum.creditedJumps,
                확인단계: peer ? sum.confirmedUnits : sum.units, 전체단계: sum.units, 완주: 완주 };
    api('mat_s_saveRecord', TOKEN, rec, 완주 === '진행 중' ? null : G.badgesBefore).then(function (r) { if (then) then(r); }).catch(function (e) { console.error(e); if (then) then(null); });
  }
  function nowStr() { var d = new Date(), p = function (n) { return ('0' + n).slice(-2); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
  function celebrate(name) { setTimeout(function () { toast('🏅 새 배지: ' + name); }, 400); }

  /* ================= 내 기록 ================= */
  function renderRecords() {
    var y = D.요약;
    $('msRecSub').textContent = y.판수 ? '지금까지 ' + y.판수 + '판 · 총 운동 시간 ' + 시간표시(y.총시간) : '아직 기록이 없어요. 게임을 하면 여기에 쌓여요.';
    $('msPTime').innerHTML = esc(시간표시(y.함께.시간)); $('msPDesc').textContent = y.함께.판수 + '판 · 점프 ' + fmt(y.함께.점프) + '회';
    $('msSTime').innerHTML = esc(시간표시(y.연습.시간)); $('msSDesc').textContent = y.연습.판수 + '판 · 점프 ' + fmt(y.연습.점프) + '회';
    var bl = y.배지 || [];
    $('msBadgeSub').textContent = y.배지수 + ' / ' + bl.length + '개';
    $('msBadges').innerHTML = bl.map(function (b) {
      return '<div class="bd' + (b.달성 ? ' on' : '') + '"><i class="ti ti-' + esc(b.아이콘) + '"></i><b>' + esc(b.이름) + '</b><small>' + esc(b.설명) + '</small>' + (b.달성 ? '' : '<div class="prog thin"><i style="width:' + b.진행 + '%"></i></div>') + '</div>';
    }).join('');
    var list = D.최근 || [];
    $('msRecent').innerHTML = list.length ? list.map(function (r) {
      return '<div class="rec"><span class="t">' + esc(String(r.시작).slice(5, 16)) + '</span><span class="g">' + esc(gname(r.게임)) + '</span>' +
        '<span class="tag ' + (r.구분 === '연습' ? '' : 'coral') + '">' + esc(r.구분 === '함께' ? '함께 · ' + r.짝이름 : r.구분 === '수업' ? '수업' : '연습') + '</span>' +
        '<span class="n">' + esc(시간표시(r.인정시간)) + ' · ' + (r.게임 === 'twist' ? '자세 ' : '점프 ') + r.인정점프 + '회' + (r.구분 === '함께' ? ' · 확인 ' + r.확인단계 + '/' + r.전체단계 : '') + (r.완주 === '중간 종료' ? ' · 중간 종료' : '') + (r.인정시간 < D.설정.최소시간 ? ' · 너무 짧아 누적 제외' : '') + '</span></div>';
    }).join('') : '<div class="empty"><i class="ti ti-history"></i><strong>아직 기록이 없어요</strong></div>';
  }

  /* ================= 문제 내기 ================= */
  function renderPropose() {
    if (!D.설정.학생제안) { $('mat_sp_propose').innerHTML = '<div class="page-head"><h2>퀴즈 문제 내기</h2></div><div class="panel"><div class="panel-body"><div class="empty"><i class="ti ti-bulb-off"></i><strong>지금은 문제 내기가 꺼져 있어요</strong></div></div></div>'; return; }
    renderMyQ();
    $('msQSend').onclick = function () {
      var q = { 문제: $('msQ').value.trim(), 정답: $('msA').value.trim(), 오답: [$('msW1').value.trim(), $('msW2').value.trim(), $('msW3').value.trim()].filter(Boolean), 해설: $('msE').value.trim(), 교과: $('msSubj').value };
      if (!q.문제 || !q.정답 || q.오답.length < 2) { setStatus('msQStatus', '문제, 정답, 오답 2개까지는 꼭 써 주세요.', 'err'); return; }
      setStatus('msQStatus', '보내는 중…');
      api('mat_s_proposeQuestion', TOKEN, q).then(function (r) {
        D.내제안 = r.내제안; ['msQ', 'msA', 'msW1', 'msW2', 'msW3', 'msE'].forEach(function (id) { $(id).value = ''; });
        setStatus('msQStatus', '보냈어요! 선생님이 확인하면 퀴즈에 나와요.', 'ok'); toast('문제를 보냈어요.'); renderMyQ();
      }).catch(function (e) { setStatus('msQStatus', (e && e.message) || String(e), 'err'); });
    };
  }
  function renderMyQ() {
    var list = (D.내제안 || []).slice().reverse();
    $('msMyQ').innerHTML = list.length ? list.map(function (q) {
      var st = q.상태 === '승인' ? '<span class="tag brand">문제 은행에 들어갔어요</span>' : q.상태 === '버림' ? '<span class="tag warn">이번엔 안 쓰기로 했어요</span>' : '<span class="tag sun">선생님 확인 중</span>';
      return '<div class="q"><div style="flex:1"><b>' + esc(q.문제) + '</b><div class="unit">' + esc(q.교과 || '') + ' · 정답 ' + esc(q.정답) + ' · 오답 ' + esc(q.오답.join(', ')) + '</div></div>' + st + '</div>';
    }).join('') : '<div class="unit">아직 낸 문제가 없어요.</div>';
  }

  return { nav: nav, init: init, show: show, reset: reset };
})();
</script>
